name: Generate manifest.json

# 推送代码后自动重新生成 manifest.json 并提交回仓库
# 这样本地就不用手动执行 tools/make_manifest.php 了
#
# 注意: 下面的分支名要和后台「系统更新 -> GitHub 分支」配置保持一致

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu runner 自带 PHP,无需额外安装
      - name: Show PHP version
        run: php -v

      - name: Generate manifest.json
        run: php tools/make_manifest.php

      - name: Commit manifest.json if changed
        run: |
          if [ -z "$(git status --porcelain manifest.json)" ]; then
            echo "manifest.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: 自动生成 manifest.json"
          git push
