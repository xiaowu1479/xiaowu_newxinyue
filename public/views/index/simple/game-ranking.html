{include file="simple/common/header"}
<meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="__STATIC__/simple/common/static/css/index.css">
</head>

<body>
    <div class="headBg" style="background-image: url({$config.home_bg});display:none;"></div>
    <div id="app" class="game-ranking-page" v-cloak>
        {include file="simple/common/navbar"}

        <div class="home-container">
            <!-- 排行榜标签栏 -->
            <div class="category-tabs-bar" v-if="displayRankings.length > 0">
                <span v-for="(rank, idx) in displayRankings" :key="idx"
                      class="category-tab" :class="{active: currentTab === idx}"
                      @click="switchTab(idx)">{{rank.title}}</span>
            </div>

            <!-- 资源卡片列表 -->
            <div class="hot-category-section">
                <div class="hot-category-list">
                    <div class="hot-category-card">
                        <template v-if="currentIsTypeGroup">
                            <div class="hot-category-card-head" v-if="typeRankings.length > 0">
                                <span class="hot-category-card-title">类型榜单<em>排行</em></span>
                                <span class="hot-category-card-count">{{typeRankings.length}}类</span>
                            </div>
                            <div v-if="loading" class="hot-category-empty">加载中...</div>
                            <el-empty v-else-if="typeRankings.length === 0" :image-size="200" description="暂无榜单数据"></el-empty>
                            <div class="game-type-ranking-list" v-else>
                                <div class="game-type-ranking-card" v-for="(rank, rankIndex) in typeRankings" :key="rankIndex">
                                    <div class="game-type-ranking-head">
                                        <span class="game-type-ranking-title">{{rank.title}}</span>
                                        <span class="game-type-ranking-count">{{rank.items.length}}款</span>
                                    </div>
                                    <div class="game-type-ranking-items">
                                        <div class="game-type-ranking-item" v-for="item in rank.items" :key="rank.title + item.ranking" @click="goToSearch(item.title)">
                                            <span class="game-type-ranking-rank" :class="{'top': item.ranking <= 3}">{{item.ranking}}</span>
                                            <span class="game-type-ranking-name">{{item.title}}</span>
                                            <span class="game-type-ranking-date" v-if="item.date">{{item.date}}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template v-else>
                            <div class="hot-category-card-head" v-if="currentItems.length > 0">
                                <span class="hot-category-card-title">{{currentTitle}}<em>排行</em></span>
                                <span class="hot-category-card-count">{{currentItems.length}}款</span>
                            </div>
                            <div v-if="loading" class="hot-category-empty">加载中...</div>
                            <el-empty v-else-if="currentItems.length === 0" :image-size="200" description="暂无榜单数据"></el-empty>
                            <div class="hot-category-grid" v-else>
                                <div class="hot-category-item" v-for="(item, index) in currentItems" :key="index" @click="goToSearch(item.title)">
                                    <div class="hot-category-cover">
                                        <span class="hot-category-rank" :class="{'top': item.ranking <= 3}">{{item.ranking}}</span>
                                        <img :src="item.cover ? '/api/game/proxy?url=' + encodeURIComponent(item.cover) : defaultCover" :alt="item.title" loading="lazy" @error="onCoverError">
                                        <div class="hot-category-overlay">
                                            <span v-if="item.genre">{{item.genre}}</span>
                                            <span v-if="item.date">{{item.date}}</span>
                                            <span v-if="item.popularity">人气: {{item.popularity}}</span>
                                        </div>
                                    </div>
                                    <div class="hot-category-name">{{item.title}}</div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        {include file="simple/common/foot"}
    </div>

    <script src="__STATIC__/simple/common/static/js/vue.global.min.js"></script>
    <script src="__STATIC__/simple/common/static/js/index.full.min.js"></script>
    <script src="__STATIC__/simple/common/static/js/axios.min.js"></script>
    <script src="__STATIC__/simple/common/static/js/app-core.js"></script>
    <script src="__STATIC__/simple/common/static/js/search.js?v=20260814"></script>
    <script type="text/javascript">
        const { createApp, ref, computed, onMounted } = Vue;

        const app = createApp({
            setup() {
                const rankings = ref([]);
                const currentTab = ref(0);
                const loading = ref(true);
                const typeRankingTitles = [
                    '第一人称射击游戏排行',
                    '第三人称射击游戏排行',
                    '动作游戏排行',
                    '角色扮演游戏排行',
                    '动作角色扮演游戏排行',
                    '竞速游戏排行',
                    '策略&战略游戏排行',
                    '冒险游戏排行',
                    '模拟游戏排行',
                    '体育游戏排行',
                    '格斗游戏排行',
                    '飞行射击游戏排行',
                    '休闲益智游戏排行',
                    '音乐游戏排行',
                    '恋爱养成游戏排行'
                ];
                const typeRankingTitleSet = new Set(typeRankingTitles);

                const typeRankings = computed(() => {
                    return rankings.value.filter(rank => typeRankingTitleSet.has(rank.title));
                });
                const displayRankings = computed(() => {
                    const normalRankings = rankings.value.filter(rank => !typeRankingTitleSet.has(rank.title));
                    if (typeRankings.value.length > 0) {
                        normalRankings.push({ title: '类型榜单', items: [] });
                    }
                    return normalRankings;
                });
                const currentRanking = computed(() => {
                    return displayRankings.value[currentTab.value] || {};
                });
                const currentIsTypeGroup = computed(() => {
                    return currentRanking.value.title === '类型榜单';
                });

                const currentItems = computed(() => {
                    return currentRanking.value.items || [];
                });
                const currentTitle = computed(() => {
                    return currentRanking.value.title || '';
                });

                // 主题
                const currentTheme = ref('dark');
                const initTheme = () => {
                    let defaultTheme = '{$config.simple_default_theme}' || 'dark';
                    if (defaultTheme !== 'dark' && defaultTheme !== 'light') defaultTheme = 'dark';
                    let savedTheme = localStorage.getItem('app-theme') || defaultTheme;
                    if (savedTheme !== 'dark' && savedTheme !== 'light') savedTheme = defaultTheme;
                    currentTheme.value = savedTheme;
                    document.documentElement.setAttribute('data-theme', savedTheme);
                };
                const toggleTheme = () => {
                    const newTheme = currentTheme.value === 'dark' ? 'light' : 'dark';
                    currentTheme.value = newTheme;
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('app-theme', newTheme);
                };

                // navbar 变量
                const keyword = ref('');
                const {
                    searchBtn, searchDialogVisible, searchDialogStage, searchSelectedPanType,
                    openSearchDialog, selectPanAndSearch, backToSelectPanType, onDialogKeywordEnter,
                    startMultiSearch, selectAllPanTypes, clearPanTypes,
                    resultFilterPanType, availableResultTabs, setResultFilterPanType,
                    switchPanFromResource
                } = window.searchModule.createDialogState(keyword, { validateKeywordOnSearch: false, selectPanAndSearchMode: 'toggle' });
                const drawer = ref(false);
                const qcodeVisible = ref(false);
                const layerVisible = ref(false);
                const content = ref('');
                const saveBtn = () => { layerVisible.value = false; };

                // 弹窗变量
                const dialogUrl = ref(false);
                const dialogLoading = ref(false);
                const dialogItem = ref({});
                const downloadWithThunder = () => {};
                const is_m = ref(0);
                const pc_type = ref(0);
                const panTypeMap = ref({});
                const copyToClipboard = (text) => { if (navigator.clipboard) navigator.clipboard.writeText(text); };

                // 封面图
                const defaultCover = ref('data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2538"/><stop offset="1" stop-color="#0e1620"/></linearGradient></defs><rect fill="url(#bg)" width="200" height="280" rx="8"/><g transform="translate(100,125)" opacity="0.25"><rect x="-28" y="-20" width="56" height="40" rx="4" fill="none" stroke="#8aa5ff" stroke-width="2"/><circle cx="-10" cy="-8" r="5" fill="#8aa5ff"/><path d="M-22,14 L-6,-2 L8,10 L22,-6 L22,14 Z" fill="#8aa5ff"/></g><text x="100" y="185" font-size="13" fill="#5a6a80" text-anchor="middle" font-family="sans-serif">暂无封面</text></svg>'));
                const onCoverError = (e) => { e.target.src = defaultCover.value; };

                if (window.searchModule) {
                    window.searchModule.setupResourceDialog({
                        dialogUrl, dialogLoading, dialogItem
                    });
                }

                // 搜索：不跳首页，在当前页打开搜索弹窗并预填关键字
                const goToSearch = (title) => {
                    if (!title) return;
                    keyword.value = title;
                    openSearchDialog();
                };

                // 切换标签
                const switchTab = (idx) => {
                    currentTab.value = idx;
                };

                const normalizeCurrentTab = () => {
                    if (currentTab.value >= displayRankings.value.length) {
                        currentTab.value = 0;
                    }
                };

                // 加载数据
                const loadData = async () => {
                    loading.value = true;
                    try {
                        const res = await axios.get('/api/game/ranking');
                        if (res.data && res.data.code === 200 && res.data.data) {
                            rankings.value = res.data.data || [];
                            normalizeCurrentTab();
                        }
                    } catch (e) {
                        rankings.value = [];
                    } finally {
                        loading.value = false;
                    }
                };

                onMounted(() => {
                    initTheme();
                    loadData();
                });

                return {
                    rankings, displayRankings, typeRankings, currentTab, currentItems, currentTitle, currentIsTypeGroup, loading,
                    switchTab, goToSearch,
                    currentTheme, toggleTheme,
                    keyword, searchBtn, drawer, qcodeVisible,
                    layerVisible, content, saveBtn,
                    dialogUrl, dialogLoading, dialogItem,
                    switchPanFromResource, downloadWithThunder,
                    is_m, pc_type, panTypeMap, copyToClipboard,
                    defaultCover, onCoverError,
                    searchDialogVisible, searchDialogStage, searchSelectedPanType,
                    openSearchDialog, selectPanAndSearch, backToSelectPanType, onDialogKeywordEnter,
                    startMultiSearch, selectAllPanTypes, clearPanTypes,
                    resultFilterPanType, availableResultTabs, setResultFilterPanType
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
        document.documentElement.removeAttribute('data-page-loading');
    </script>
</body>
</html>
