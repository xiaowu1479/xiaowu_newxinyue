{include file="simple/common/header"}
<meta name="referrer" content="never">
    <link rel="stylesheet" href="__STATIC__/simple/common/static/css/index.css">
</head>

<body>
    <div class="headBg" style="background-image: url({$config.home_bg});display:none;"></div>
    <div id="app" v-cloak>
        {include file="simple/common/navbar"}

        <div class="home-container">
            <!-- 移动端搜索框 -->
            <div class="mobile-search-box">
                <span class="nav-search-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </span>
                <input type="text" v-model="keyword" placeholder="搜索：片名 / 书名 / 关键词" @keyup.enter="searchBtn">
                <button class="search-btn" @click="searchBtn">搜索</button>
            </div>

            <!-- 分类标签栏 -->
            <div class="category-tabs-wrap">
                <div class="category-tabs-bar">
                    <span class="category-tab" :class="{active: currentCategoryId === 0}" @click="switchCategory(0)">全部</span>
                    <span v-for="cat in categoryList" :key="cat.source_category_id"
                          class="category-tab" :class="{active: currentCategoryId === cat.source_category_id}"
                          @click="switchCategory(cat.source_category_id)">{{cat.name}}</span>
                </div>
                <div class="category-sort-tabs">
                    <span class="category-tab" :class="{active: currentSort === 'hot'}" @click="switchSort('hot')">按热度</span>
                    <span class="category-tab" :class="{active: currentSort === 'time'}" @click="switchSort('time')">按时间</span>
                </div>
            </div>

            <!-- 资源卡片列表 -->
            <div class="hot-category-section">
                <div class="hot-category-list">
                    <div class="hot-category-card">
                        <div class="hot-category-card-head">
                            <span class="hot-category-card-title">{{currentCategoryName}}<em>资源</em></span>
                            <span class="hot-category-card-count" v-if="total > 0">{{total}}条</span>
                        </div>
                        <div v-if="loading" class="hot-category-empty">加载中...</div>
                        <el-empty v-else-if="list.length === 0" :image-size="200" description="暂无资源数据"></el-empty>
                        <div class="hot-category-grid" v-else>
                            <div class="hot-category-item" v-for="(item, index) in list" :key="item.id || index" @click="showItem(item)">
                                <div class="hot-category-cover">
                                    <span class="hot-category-rank" :class="{'top': index < 3}">{{index + 1}}</span>
                                    <img :src="item.src || defaultCover" :alt="item.title" loading="lazy" @error="onCoverError">
                                    <div class="hot-category-overlay">
                                        <div v-if="item.description" class="hot-category-desc">{{item.description}}</div>
                                        <span v-if="item.times">更新：{{item.times}}</span>
                                    </div>
                                </div>
                                <div class="hot-category-name">{{item.title}}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分页 -->
            <div class="category-pagination" v-if="total > pageSize">
                <el-pagination background layout="prev, pager, next" :pager-count="5"
                    :total="total" :page-size="pageSize" :current-page="currentPage"
                    @current-change="changePage"></el-pagination>
            </div>
        </div>

        {include file="simple/common/foot"}
    </div>

    <script src="__STATIC__/simple/common/static/js/vue.global.min.js"></script>
    <script src="__STATIC__/simple/common/static/js/index.full.min.js"></script>
    <script src="__STATIC__/simple/common/static/js/axios.min.js"></script>
    <script src="__STATIC__/simple/common/static/js/qrcanvas@3.js"></script>
    <script src="__STATIC__/simple/common/static/js/app-core.js"></script>
    <script src="__STATIC__/simple/common/static/js/app-pages.js"></script>
    <script src="__STATIC__/simple/common/static/js/search.js?v=202609282"></script>
    <script src="__STATIC__/simple/common/static/js/novel-downloader.js?v=202609291"></script>
    <script type="text/javascript">
        const { createApp, ref, onMounted } = Vue;

        // PHP 传递的初始数据
        const __categoryList = <?php echo json_encode($categoryList ?? [], JSON_UNESCAPED_UNICODE); ?>;
        const __initialList = <?php echo json_encode($listArray ?? [], JSON_UNESCAPED_UNICODE); ?>;
        const __initialCategoryId = <?php echo $categoryId ?? 0; ?>;
        const __initialCategoryName = '<?php echo $currentCategoryName ?? "全部"; ?>';
        const __initialTotal = <?php echo $total ?? 0; ?>;
        const __initialPage = <?php echo $page ?? 1; ?>;
        const __initialPageSize = <?php echo $pageSize ?? 20; ?>;

        const app = createApp({
            setup() {
                // 分类数据
                const categoryList = ref(__categoryList);
                const currentCategoryId = ref(__initialCategoryId);
                const currentCategoryName = ref(__initialCategoryName);
                const list = ref([]);
                const loading = ref(true);
                const total = ref(0);
                const currentPage = ref(__initialPage);
                const pageSize = ref(__initialPageSize);
                const currentSort = ref('time');
                const currentResourceType = ref(0);

                // 主题
                const currentTheme = ref('dark');
                const initTheme = () => {
                    let savedTheme = localStorage.getItem('app-theme') || 'dark';
                    if (savedTheme !== 'dark' && savedTheme !== 'light') savedTheme = 'dark';
                    currentTheme.value = savedTheme;
                    document.documentElement.setAttribute('data-theme', savedTheme);
                };
                const toggleTheme = () => {
                    const newTheme = currentTheme.value === 'dark' ? 'light' : 'dark';
                    currentTheme.value = newTheme;
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('app-theme', newTheme);
                };

                // navbar 需要的变量
                const keyword = ref('');
                const {
                    searchBtn, searchDialogVisible, searchDialogStage, searchSelectedPanType,
                    openSearchDialog, selectPanAndSearch, backToSelectPanType, onDialogKeywordEnter,
                    startMultiSearch, selectAllPanTypes, clearPanTypes,
                    resultFilterPanType, availableResultTabs, setResultFilterPanType,
                    switchPanFromResource
                } = window.searchModule.createDialogState(keyword, { validateKeywordOnSearch: false, selectPanAndSearchMode: 'toggle' });
                // navbar 通用绑定：非小说页搜索走原 searchBtn
                const isNovelPage = false;
                const navbarSearch = () => { searchBtn(); };
                const drawer = ref(false);
                const qcodeVisible = ref(false);
                const layerVisible = ref(false);
                const content = ref('');
                const saveBtn = () => { layerVisible.value = false; };

                // 弹窗
                const dialogUrl = ref(false);
                const dialogLoading = ref(false);
                const dialogItem = ref({});
                const downloadWithThunder = (url, title) => {
                    if (!url || !url.startsWith('magnet:')) return;
                    safeJump('thunder://' + btoa('AA' + url + 'ZZ'));
                };
                const is_m = ref(0);
                const pc_type = ref(0);
                const panTypeMap = ref(<?php echo json_encode($panTypeMap ?? [], JSON_UNESCAPED_UNICODE); ?>);
                const copyToClipboard = (text) => { if (navigator.clipboard) navigator.clipboard.writeText(text); };
                const defaultCover = ref('data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2538"/><stop offset="1" stop-color="#0e1620"/></linearGradient></defs><rect fill="url(#bg)" width="200" height="280" rx="8"/><g transform="translate(100,125)" opacity="0.25"><rect x="-28" y="-20" width="56" height="40" rx="4" fill="none" stroke="#8aa5ff" stroke-width="2"/><circle cx="-10" cy="-8" r="5" fill="#8aa5ff"/><path d="M-22,14 L-6,-2 L8,10 L22,-6 L22,14 Z" fill="#8aa5ff"/></g><text x="100" y="185" font-size="13" fill="#5a6a80" text-anchor="middle" font-family="sans-serif">暂无封面</text></svg>'));
                const onCoverError = (e) => { e.target.src = defaultCover.value; };

                if (window.searchModule) {
                    window.searchModule.setupResourceDialog({
                        dialogUrl, dialogLoading, dialogItem
                    });
                }

                // 显示资源弹窗
                const showItem = (item) => {
                    item.showUrl = item.url || '';
                    if (item.showUrl && item.showUrl.startsWith('magnet:')) {
                        item.thunderUrl = 'thunder://' + btoa('AA' + item.showUrl + 'ZZ');
                    }
                    dialogItem.value = item;
                    dialogUrl.value = true;
                    if (item.showUrl) {
                        Vue.nextTick(() => {
                            setTimeout(() => {
                                const qrcodeEl = document.getElementById('qrcode');
                                if (qrcodeEl && typeof qrcanvas !== 'undefined') {
                                    qrcodeEl.innerHTML = '';
                                    const canvas = qrcanvas.qrcanvas({ data: item.showUrl, size: 120 });
                                    qrcodeEl.appendChild(canvas);
                                } else {
                                    setTimeout(() => {
                                        const el2 = document.getElementById('qrcode');
                                        if (el2 && typeof qrcanvas !== 'undefined') {
                                            el2.innerHTML = '';
                                            const canvas2 = qrcanvas.qrcanvas({ data: item.showUrl, size: 120 });
                                            el2.appendChild(canvas2);
                                        }
                                    }, 300);
                                }
                            }, 300);
                        });
                    }
                };

                // 加载分类数据
                const loadData = async (categoryId, page) => {
                    loading.value = true;
                    try {
                        const res = await axios.get('/api/search/getCategoryResources', {
                            params: {
                                category_id: categoryId,
                                page: page,
                                page_size: pageSize.value,
                                sort: currentSort.value,
                                is_time: currentResourceType.value
                            }
                        });
                        if (res.data && res.data.code === 200 && res.data.data) {
                            list.value = res.data.data.list || [];
                            total.value = res.data.data.total || 0;
                        } else {
                            list.value = [];
                            total.value = 0;
                        }
                    } catch (e) {
                        list.value = [];
                        total.value = 0;
                    } finally {
                        loading.value = false;
                    }
                };

                // 切换分类
                const switchCategory = (id) => {
                    if (currentCategoryId.value === id) return;
                    currentCategoryId.value = id;
                    currentPage.value = 1;
                    // 更新分类名称
                    if (id === 0) {
                        currentCategoryName.value = '全部';
                    } else {
                        const cat = categoryList.value.find(c => c.source_category_id === id);
                        currentCategoryName.value = cat ? cat.name : '全部';
                    }
                    loadData(id, 1);
                };

                // 切换排序
                const switchSort = (sort) => {
                    if (currentSort.value === sort) return;
                    currentSort.value = sort;
                    currentPage.value = 1;
                    loadData(currentCategoryId.value, 1);
                };

                // 切换页码
                const changePage = (page) => {
                    currentPage.value = page;
                    loadData(currentCategoryId.value, page);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                onMounted(() => {
                    initTheme();
                    loadData(currentCategoryId.value, currentPage.value);
                });

                return {
                    // 分类
                    categoryList, currentCategoryId, currentCategoryName,
                    list, loading, total, currentPage, pageSize, currentSort,
                    switchCategory, switchSort, changePage, showItem,
                    // 主题
                    currentTheme, toggleTheme,
                    // navbar
                    keyword, searchBtn, drawer, qcodeVisible, isNovelPage, navbarSearch,
                    layerVisible, content, saveBtn,
                    // 弹窗
                    dialogUrl, dialogLoading, dialogItem,
                    switchPanFromResource, downloadWithThunder,
                    is_m, pc_type, panTypeMap, copyToClipboard,
                    defaultCover, onCoverError,
                    searchDialogVisible, searchDialogStage, searchSelectedPanType,
                    openSearchDialog, selectPanAndSearch, backToSelectPanType, onDialogKeywordEnter,
                    startMultiSearch, selectAllPanTypes, clearPanTypes,
                    resultFilterPanType, availableResultTabs, setResultFilterPanType
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
        document.documentElement.removeAttribute('data-page-loading');
    </script>
</body>
</html>
