<script src="__STATIC__/simple/common/static/js/vue.global.min.js"></script>
<script src="__STATIC__/simple/common/static/js/index.full.min.js"></script>
<script src="__STATIC__/simple/common/static/js/axios.min.js"></script>
<script src="__STATIC__/simple/common/static/js/qrcanvas@3.js"></script>
<script src="__STATIC__/simple/common/static/js/app-core.js"></script>
<script src="__STATIC__/simple/common/static/js/search.js?v=202609282"></script>
<script src="__STATIC__/simple/common/static/js/novel-downloader.js?v=202609291"></script>
<script src="__STATIC__/simple/common/static/js/app-pages.js"></script>
<script src="//open.thunderurl.com/thunder-link.js"></script>
<script>
// 首页轮播数据由控制器注入（app\service\BannerService：qf_banner 优先，异常或为空回退扫描 banner 目录，缓存 10 分钟）
window.__BANNER_LIST = {$bannerListJson|raw};
    const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;
    const { ElButton, ElMessage  } = ElementPlus;
    const app = createApp({
        setup() {
            // 定义响应式数据
            const elementOpacity = ref(0);
            const scrollThreshold = ref(150); // 动态设置的滚动阈值
            const keyword = ref('{$keyword??''}');
            const qcodeVisible = ref(false);
            const layerVisible = ref(false);
            const content = ref('');
            const load = ref(false)
            const drawer = ref(false)
            const rankList = ref([]);
            const rankDj = ref([]);
            const is_m = ref(0);
            const newList = ref([]);
            const QList = ref([]);
            const QLoading = ref(false);
            const total_result = ref(0);
            const currentSource = ref(0);
            const dialogUrl = ref(false);
            const dialogLoading = ref(false);
            const dialogItem = ref({});
            if (window.searchModule) {
                window.searchModule.setupResourceDialog({
                    dialogUrl: dialogUrl,
                    dialogLoading: dialogLoading,
                    dialogItem: dialogItem,
                    onShowResource: function() { loadHotKeywords(); }
                    // 小说下载任务由 novel-downloader.js 全局接管（search.js 直接调 window.novelDownloader.startTask），
                    // 此处不再注册 startNovelDownload 回调
                });
            }
            const is_type = ref(0);
            const pc_type = ref(0);
            const panTypeMap = ref(<?php echo json_encode($panTypeMap ?? [], JSON_UNESCAPED_UNICODE); ?>);
            
            // TMDB 影视信息
            const tmdbData = ref({});
            const tmdbLoading = ref(false);

            // 热搜词
            const hotKeywords = ref([]);
            const loadHotKeywords = async function() {
                try {
                    const response = await axios.get('/api/other/get_hot_keywords?limit=10');
                    if (response.data.code === 200 && response.data.data && response.data.data.items) {
                        hotKeywords.value = response.data.data.items;
                    }
                } catch (e) {
                    hotKeywords.value = [];
                }
            };
            // 点击热搜词搜索
            const searchHotKeyword = function(kw) {
                keyword.value = kw;
                if (typeof searchBtn === 'function') {
                    searchBtn();
                } else if (window.app && window.app.searchBtn) {
                    window.app.searchBtn();
                }
            };

            // 分类热搜 - 从后台 SourceCategory 动态获取，按 is_type 选择数据源
            // is_type=0: 网络资源（夸克 API），is_type=1: 本地资源（localRanking）
            const hotCategories = ref([]);
            const hotCategoryData = ref({});
            const loadHotCategories = function() {
                axios.get('/api/search/getCategory').then(function(res) {
                    if (res.data && res.data.data && Array.isArray(res.data.data)) {
                        // 按 sort desc 排序已由后端处理
                        var cats = res.data.data.map(function(c) {
                            return {
                                channel: c.name,
                                label: c.name,
                                is_type: c.is_type || 0
                            };
                        });
                        hotCategories.value = cats;
                        // 逐个分类加载榜单数据
                        cats.forEach(function(cat) {
                            var params = { channel: cat.channel, rank_type: '热搜榜', page_size: 12 };
                            if (cat.is_type === 1) {
                                params.source = 'local';
                            }
                            axios.get('/api/tool/ranking', { params: params })
                                .then(function(r) {
                                    if (r.data && r.data.data) {
                                        var list = r.data.data.data || r.data.data || [];
                                        if (!Array.isArray(list)) list = [];
                                        hotCategoryData.value[cat.channel] = list;
                                        hotCategoryData.value = Object.assign({}, hotCategoryData.value);
                                    }
                                }).catch(function() {});
                        });
                    }
                }).catch(function() {});
            };
            // 默认封面 SVG - 随白天/黑夜模式切换
            const darkCoverSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3Crect width='300' height='400' fill='%23141E2E'/%3E%3Crect x='80' y='130' width='140' height='180' rx='8' fill='none' stroke='%23E8A547' stroke-width='2' opacity='0.4'/%3E%3Ccircle cx='150' cy='180' r='24' fill='none' stroke='%23E8A547' stroke-width='2' opacity='0.5'/%3E%3Cpath d='M150 170 a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20' fill='%23E8A547' opacity='0.4'/%3E%3Cpath d='M120 300 Q150 260 180 300 L180 310 L120 310 Z' fill='%23E8A547' opacity='0.3'/%3E%3Ctext x='150' y='350' text-anchor='middle' fill='%238B9BB4' font-size='14' font-family='sans-serif'%3E%E6%97%A0%E5%B0%81%E9%9D%A2%3C/text%3E%3C/svg%3E";
            const lightCoverSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3Crect width='300' height='400' fill='%23FAF7F0'/%3E%3Crect x='80' y='130' width='140' height='180' rx='8' fill='none' stroke='%23C8881E' stroke-width='2' opacity='0.4'/%3E%3Ccircle cx='150' cy='180' r='24' fill='none' stroke='%23C8881E' stroke-width='2' opacity='0.5'/%3E%3Cpath d='M150 170 a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20' fill='%23C8881E' opacity='0.4'/%3E%3Cpath d='M120 300 Q150 260 180 300 L180 310 L120 310 Z' fill='%23C8881E' opacity='0.3'/%3E%3Ctext x='150' y='350' text-anchor='middle' fill='%236B6557' font-size='14' font-family='sans-serif'%3E%E6%97%A0%E5%B0%81%E9%9D%A2%3C/text%3E%3C/svg%3E";
            const defaultCover = computed(() => currentTheme.value === 'light' ? lightCoverSvg : darkCoverSvg);
            // 图片加载失败时替换为默认封面
            const onCoverError = function(e) {
                e.target.src = defaultCover.value;
            };
            // 点击分类热搜卡片 -> 本地数据直接显示弹窗，网络数据用标题搜索
            const searchByTitle = function(title) {
                if (typeof window.searchByKeyword === 'function') {
                    window.searchByKeyword(title);
                }
            };
            // 分类热搜卡片点击：本地数据(is_type=1)直接显示资源弹窗，网络数据用标题搜索
            const showHotCategoryResource = function(item, cat) {
                if (cat.is_type === 1) {
                    // 本地数据：弹窗显示链接
                    if (item.id) {
                        axios.post('/api/search/incrementViews', { id: item.id }).catch(function() {});
                    }
                    dialogLoading.value = true;
                    dialogUrl.value = true;
                    dialogItem.value = {};
                    var rawUrl = item.url || '';
                    if (rawUrl && (rawUrl.startsWith('http') || rawUrl.startsWith('magnet:'))) {
                        item.showUrl = rawUrl;
                        showResourceDialog(item);
                    } else if (rawUrl) {
                        axios.post('/api/other/save_url', {
                            url: encodeURIComponent(rawUrl),
                            title: item.title
                        }).then(function(res) {
                            if (res.data.code == 200) {
                                item.showUrl = res.data.data.url || '';
                            } else {
                                item.showUrl = '';
                                item.message = res.data.message || '获取失败';
                            }
                            showResourceDialog(item);
                        }).catch(function() {
                            item.showUrl = '';
                            item.message = '网络错误，请重试';
                            showResourceDialog(item);
                        });
                    } else {
                        item.showUrl = '';
                        item.message = '暂无资源链接';
                        showResourceDialog(item);
                    }
                } else {
                    // 网络数据：用标题搜索
                    searchByTitle(item.title);
                }
            };

            // 首页 Banner 轮播（读取 banner 目录所有图片）
            const bannerList = ref(window.__BANNER_LIST || []);
            const bannerIndex = ref(0);
            let bannerTimer = null;
            const stopBannerAuto = function() {
                if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
            };
            const startBannerAuto = function() {
                stopBannerAuto();
                if (bannerList.value.length > 1) {
                    bannerTimer = setInterval(function() {
                        bannerIndex.value = (bannerIndex.value + 1) % bannerList.value.length;
                    }, 5000);
                }
            };
            const bannerGo = function(i) {
                if (!bannerList.value.length) return;
                bannerIndex.value = (i + bannerList.value.length) % bannerList.value.length;
                startBannerAuto();
            };
            // Banner 点击：配置了跳转链接则新窗口打开，否则按名称搜索
            const onBannerClick = function(item) {
                if (!item) return;
                var link = (item.link || '').trim();
                if (link) { window.open(link, '_blank'); return; }
                if (item.name) searchByTitle(item.name);
            };

            // 白天/黑夜模式切换
            const currentTheme = ref('dark');
            const themeSwitcherRef = ref(null);

            // 切换白天/黑夜
            const toggleTheme = () => {
                const next = currentTheme.value === 'dark' ? 'light' : 'dark';
                currentTheme.value = next;
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('app-theme', next);
            };

            // 初始化主题（兼容旧值：blue/red/green -> dark）
            const initTheme = () => {
                let savedTheme = localStorage.getItem('app-theme') || 'dark';
                if (savedTheme !== 'dark' && savedTheme !== 'light') savedTheme = 'dark';
                currentTheme.value = savedTheme;
                document.documentElement.setAttribute('data-theme', savedTheme);
            };
            
            // 公共消息方法
            const showMessage = (message, type = 'info') => {
                ElMessage({
                    message,
                    type,
                    plain: true,
                });
            };


             // 滚动监听方法
            const handleScroll = () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                elementOpacity.value = scrollTop >= scrollThreshold.value
                    ? Math.min((scrollTop - scrollThreshold.value) / 100, 1)
                    : Math.max(1 - (scrollThreshold.value - scrollTop) / 100, 0);
    
                const boxElement = document.querySelector('.listBox .screen .fixed .box');
                if (boxElement && boxElement.style.display === 'block' && is_m.value) {
                    boxElement.style.display = 'none';
                }
            };

            // 选中线路缓存键
            const SELECTED_PAN_TYPE_KEY = 'selected_pan_type';

            // 读取选中的线路类型（提前定义，避免初始化时访问不到）
            const getSelectedPanType = () => {
                try {
                    return localStorage.getItem(SELECTED_PAN_TYPE_KEY);
                } catch (e) {
                    return null;
                }
            };

            // 获取可用的线路类型（转换为字符串数组）
            var availablePanTypes = <?php echo json_encode(array_keys($panTypeMap ?? []), JSON_UNESCAPED_UNICODE); ?>.map(String);
            // 默认选中排序第一的线路
            var defaultPanType = String(availablePanTypes[0] || '9');
            // 尝试读取保存的选中状态
            var savedPanType = getSelectedPanType();
            // 当前选中的网盘类型，优先使用保存的状态，否则使用默认值
            var currentPanType = (savedPanType && availablePanTypes.includes(savedPanType)) ? savedPanType : defaultPanType;
            const searchState = window.searchModule.createDialogState(keyword, {
                validateKeywordOnSearch: false,
                selectPanAndSearchMode: 'toggle',
                // 小说页单一线路（is_type=11）：跳过线路选择，打开弹窗即直接调用搜索接口
                autoSearch: window.__NOVEL_PAGE__ === true,
                getDefaultPanType: function() { return isNovelPage ? ['11'] : [currentPanType || defaultPanType || '']; },
                onEmptyKeyword: function() { showMessage('请输入你要搜索的内容~', 'error'); },
                onEmptyPanType: function() { showMessage('请至少选择一条线路~', 'error'); },
                onSelectPanType: function(panTypes) {
                    currentPanType = Array.isArray(panTypes) && panTypes.length > 0 ? panTypes[0] : (panTypes || '');
                    saveSelectedPanType(currentPanType);
                },
                stopSearch: function() {
                    window.searchModule.stopSearch();
                    if (currentEventSource) {
                        try { currentEventSource.close(); } catch (e) {}
                        currentEventSource = null;
                    }
                },
                doSearch: function(panTypes) { return window.searchModule.doSearch(keyword.value, panTypes); }
            });
            const searchBtn = searchState.searchBtn;
            const searchDialogVisible = searchState.searchDialogVisible;
            const searchDialogStage = searchState.searchDialogStage;
            const searchSelectedPanType = searchState.searchSelectedPanType;
            const openSearchDialog = searchState.openSearchDialog;
            const selectPanAndSearch = searchState.selectPanAndSearch;
            const startMultiSearch = searchState.startMultiSearch;
            const selectAllPanTypes = searchState.selectAllPanTypes;
            const clearPanTypes = searchState.clearPanTypes;
            const resultFilterPanType = searchState.resultFilterPanType;
            const availableResultTabs = searchState.availableResultTabs;
            const setResultFilterPanType = searchState.setResultFilterPanType;
            const backToSelectPanType = searchState.backToSelectPanType;
            const onDialogKeywordEnter = searchState.onDialogKeywordEnter;
            var searchResults = [];
            var currentEventSource = null;

            // ==================== 小说板块（仅 /novel 页面，番茄榜单） ====================
            // novel.html 在引入本脚本前设置 window.__NOVEL_PAGE__ = true
            const isNovelPage = window.__NOVEL_PAGE__ === true;
            const novelTab = ref('male_hot');
            const novelTabs = {
                male_hot:   { gender: 1, rankMold: 2, label: '男频·阅读榜' },
                male_new:   { gender: 1, rankMold: 1, label: '男频·新书榜' },
                female_hot: { gender: 0, rankMold: 2, label: '女频·阅读榜' },
                female_new: { gender: 0, rankMold: 1, label: '女频·新书榜' }
            };
            const novelTabLabel = computed(() => (novelTabs[novelTab.value] || {}).label || '番茄排行榜');
            const novelCategories = ref([]);
            const novelCategoryId = ref('1141');
            const novelBooks = ref([]);
            const novelLoading = ref(false);
            var novelCategoryAll = { male: [], female: [] };

            // 加载番茄分类列表（男频/女频），仅请求一次
            const loadNovelCategories = async function () {
                if (novelCategoryAll.male.length || novelCategoryAll.female.length) {
                    applyNovelCategories();
                    return;
                }
                try {
                    const response = await axios.get('/api/other/novel_rank?action=categories');
                    const data = (response.data && response.data.code === 200 && response.data.data) ? response.data.data : {};
                    novelCategoryAll.male = Array.isArray(data.male) ? data.male : [];
                    novelCategoryAll.female = Array.isArray(data.female) ? data.female : [];
                } catch (e) {
                    novelCategoryAll.male = [];
                    novelCategoryAll.female = [];
                }
                applyNovelCategories();
            };

            // 按当前 Tab 的性别切换分类列表
            const applyNovelCategories = function () {
                const tab = novelTabs[novelTab.value] || novelTabs.male_hot;
                const list = tab.gender === 1 ? novelCategoryAll.male : novelCategoryAll.female;
                novelCategories.value = list;
                if (!list.some(function (c) { return c.id === novelCategoryId.value; })) {
                    novelCategoryId.value = list.length ? list[0].id : '';
                }
            };

            // 加载当前榜单书籍
            const loadNovelBooks = async function () {
                if (novelLoading.value) return;
                novelLoading.value = true;
                try {
                    const tab = novelTabs[novelTab.value] || novelTabs.male_hot;
                    const response = await axios.get('/api/other/novel_rank', { params: {
                        action: 'books',
                        gender: tab.gender,
                        rankMold: tab.rankMold,
                        categoryId: novelCategoryId.value,
                        limit: 24
                    }});
                    const data = (response.data && response.data.code === 200 && response.data.data) ? response.data.data : {};
                    novelBooks.value = Array.isArray(data.books) ? data.books : [];
                } catch (e) {
                    novelBooks.value = [];
                } finally {
                    novelLoading.value = false;
                }
            };

            // 切换榜单 Tab（男频/女频 × 阅读/新书）
            const switchNovelTab = function (key) {
                if (!novelTabs[key] || novelTab.value === key) return;
                novelTab.value = key;
                applyNovelCategories();
                loadNovelBooks();
            };

            // 切换分类
            const switchNovelCategory = function (id) {
                if (novelCategoryId.value === id) return;
                novelCategoryId.value = id;
                loadNovelBooks();
            };

            // 点击榜单卡片：与其它板块一致，打开统一搜索弹窗（默认选中小说线路），由用户发起小说搜索
            const openNovelBook = function (book) {
                if (!book) return;
                keyword.value = book.title || book.name || '';
                searchBtn();
            };

            // 导航栏搜索：百度小说板块走板块内搜索（/baidu_novel?wd=），其余板块统一打开搜索弹窗（小说页默认选中小说线路）
            const navbarSearch = function () {
                if (isBaiduNovelPage) {
                    const word = (keyword.value || '').trim();
                    if (!word) {
                        showMessage('请输入你要搜索的内容~', 'error');
                        return;
                    }
                    bnSearchWord.value = word;
                    submitBnSearch();
                    return;
                }
                searchBtn();
            };

            // ==================== 百度小说板块（仅 /baidu_novel 页面，百度网盘小说资源） ====================
            // baidu-novel.html 在引入本脚本前设置 window.__BAIDU_NOVEL_PAGE__ = true
            const isBaiduNovelPage = window.__BAIDU_NOVEL_PAGE__ === true;
            const bnCategories = ref([]);
            const bnCategory = ref('all');
            const bnBookStatus = ref(-1);
            const bnStatusTabs = [
                { value: -1, label: '全部' },
                { value: 0, label: '连载中' },
                { value: 1, label: '已完结' }
            ];
            const bnBooks = ref([]);
            const bnLoading = ref(false);
            const bnPage = ref(1);
            const bnHasMore = ref(false);
            const bnMode = ref('list'); // list 分类列表 | search 关键词搜索
            const bnSearchWord = ref('');
            // 口令弹层（点击卡片生成百度网盘口令）
            const bnCodeVisible = ref(false);
            const bnCodeLoading = ref(false);
            const bnCodeText = ref('');
            const bnCodeBook = ref(null);
            const bnCodeFor = ref(''); // 口令对应的书籍 id（换书时重新生成）

            // 加载分类列表（对齐 /api/novel/categories：data 为字符串数组），仅请求一次
            const loadBnCategories = async function () {
                if (bnCategories.value.length) return;
                try {
                    const response = await axios.get('/api/novel/categories');
                    const data = (response.data && response.data.code === 200 && Array.isArray(response.data.data)) ? response.data.data : [];
                    bnCategories.value = data;
                } catch (e) {
                    bnCategories.value = [];
                }
            };

            // 列表/搜索请求失败提示（保留当前页内容）
            const bnRequestError = function (e) {
                const msg = (e.response && e.response.data && e.response.data.message) || '加载失败，请稍后重试';
                ElMessage.error(msg);
            };

            // 加载分类列表分页
            const loadBnBooks = async function (page) {
                if (bnLoading.value) return;
                bnLoading.value = true;
                try {
                    const response = await axios.get('/api/novel/list', { params: {
                        page: page,
                        page_size: 24,
                        category: bnCategory.value,
                        book_status: bnBookStatus.value
                    }});
                    const payload = (response.data && response.data.code === 200 && response.data.data) ? response.data.data : null;
                    if (payload) {
                        bnBooks.value = Array.isArray(payload.list) ? payload.list : [];
                        bnPage.value = payload.page || page;
                        bnHasMore.value = !!payload.has_more;
                    } else {
                        bnBooks.value = [];
                        bnHasMore.value = false;
                    }
                } catch (e) {
                    bnRequestError(e);
                } finally {
                    bnLoading.value = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            // 加载搜索分页
            const loadBnSearch = async function (page) {
                if (bnLoading.value) return;
                bnLoading.value = true;
                try {
                    const response = await axios.get('/api/novel/search', { params: {
                        keyword: keyword.value,
                        page: page,
                        page_size: 24
                    }});
                    const payload = (response.data && response.data.code === 200 && response.data.data) ? response.data.data : null;
                    if (payload) {
                        bnBooks.value = Array.isArray(payload.list) ? payload.list : [];
                        bnPage.value = payload.page || page;
                        bnHasMore.value = !!payload.has_more;
                    } else {
                        bnBooks.value = [];
                        bnHasMore.value = false;
                    }
                } catch (e) {
                    bnRequestError(e);
                } finally {
                    bnLoading.value = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            // 翻页（按当前模式选择列表或搜索接口）
            const bnGotoPage = function (delta) {
                const next = bnPage.value + delta;
                if (next < 1 || bnLoading.value) return;
                if (bnMode.value === 'search') {
                    loadBnSearch(next);
                } else {
                    loadBnBooks(next);
                }
            };

            // 切换分类（回到列表模式）
            const switchBnCategory = function (cat) {
                if (bnMode.value === 'list' && bnCategory.value === cat) return;
                bnMode.value = 'list';
                bnCategory.value = cat;
                bnPage.value = 1;
                loadBnBooks(1);
            };

            // 切换完结状态（回到列表模式）
            const switchBnStatus = function (value) {
                if (bnMode.value === 'list' && bnBookStatus.value === value) return;
                bnMode.value = 'list';
                bnBookStatus.value = value;
                bnPage.value = 1;
                loadBnBooks(1);
            };

            // 搜索提交：跳转 URL 参数（与导航搜索关键词打通，支持刷新与分享）
            const submitBnSearch = function () {
                const word = (bnSearchWord.value || '').trim();
                if (!word) return;

            // ==================== 小说后台下载管理（已收敛至独立模块 novel-downloader.js） ====================

            // 搜索结果缓存配置（10分钟）

                }

            // 清空搜索结果缓存
            const clearSearchCache = (query, panType) => {

            // 从缓存加载搜索结果
            const loadSearchResultsFromCache = (cacheData) => {
                var section = document.getElementById('searchResultSection');
                var content = document.getElementById('searchResultContent');
                var countEl = document.getElementById('searchResultCount');

                section.classList.add('show');
                // 合并本地资源和缓存结果（本地资源在前）
                var webResults = cacheData.data || [];
                searchResults = hasLocalData ? [...localSearchResults, ...webResults] : webResults;
                var localCount = hasLocalData ? localSearchResults.length : 0;
                var localText = localCount > 0 ? '（含' + localCount + '条本地）' : '';
                countEl.textContent = '共 ' + searchResults.length + ' 条结果' + localText;
                
                // 检查是否有缓存的检测结果
                var hasCachedResults = cacheData.checkResults && Object.keys(cacheData.checkResults).length > 0;
                
                // 渲染搜索结果，如果有缓存的检测结果一并应用
                renderSearchResults(searchResults, cacheData.checkResults);
                
                // 启动链接检测（会跳过已缓存的检测结果，继续检测未完成的链接）

            // 仅搜索不查询TMDB（用于切换线路）
            const searchOnly = async () => {

                // 小说线路（is_type=11）：纯同步转发到 no-novel-node /search/aggregated，xinyue 不掺业务逻辑
                if (String(currentPanType) === '11') {

                        const section = document.getElementById('searchResultSection');

                        // 显示加载中转圈（与 SSE 路径一致），axios 拿到结果后再覆盖
                        content.innerHTML = '<div class="search-result-loading"><div class="loading-wrapper"><div class="loading-pulse"></div><div class="loading-pulse"></div><div class="loading-pulse"></div><i class="iconfont icon-jiazai"></i></div><div class="loading-text">正在全网搜索</div></div>';

            // 获取最后一次缓存的 TMDB 数据（不检查过期时间）

                try {

                        const cacheData = localStorage.getItem(cacheKey);

                }

                        // 查找与关键字同名的结果，如果没有则取第一条
                        const results = response.data.results;
                        let matchedResult = results.find(item =>
                            item.title === query || item.original_title === query || item.name === query || item.original_name === query
                        );

                        if (!matchedResult) {
                            matchedResult = results[0];
                        }

                        resultData = {
                            title: matchedResult.title || matchedResult.name,
                            original_title: matchedResult.original_title || matchedResult.original_name,
                            overview: matchedResult.overview,
                            release_date: matchedResult.release_date || matchedResult.first_air_date,
                            poster_url: matchedResult.poster_path
                                ? 'https://image.tmdb.org/t/p/w300' + matchedResult.poster_path
                                : ''
                        };
                    }

                    tmdbData.value = resultData;
                    // 保存到缓存

            // 资源弹窗中切换网盘：关闭资源弹窗，用当前资源标题打开线路选择弹窗

            // 实际搜索逻辑 - SSE全网搜
            const doSearch = async () => {

                countEl.textContent = '';

                    searchResults = hasLocalData ? [...localSearchResults] : [];

                    if (hasLocalData && localCount > 0) {

                        // 处理 [DONE] 或 [DONE] 开头的消息
                        if (event.data === '[DONE]' || event.data.startsWith('[DONE]')) {
                            isClosed = true;
                            try {
                                currentEventSource.close();

                            var totalCount = searchResults.length;
                            if (totalCount > 0) {

                                // 保存搜索结果到缓存（仅保存全网搜结果，不包含本地资源）
                                if (searchResults.length > localCount) {

                                setTimeout(function() {

                                    var webCount = currentIndex + 1 - localCount;

            // 渲染单条搜索结果项
            window.renderSearchResultItem = function(item, index) {
                var panTypeMap = {0: '夸克网盘', 1: '阿里云盘', 2: '百度网盘', 3: 'UC网盘', 4: '迅雷云盘', 5: '123云盘', 6: '115网盘', 7: '天翼云盘', 8: '移动云盘', 9: '磁力链接', 10: '光鸭网盘'};
                var title = item.title || item.note || '未知资源';
                var desc = item.desc || item.description || '';
                // 将 is_type 转换为数字来匹配 panTypeMap 的键
                var isTypeNum = parseInt(item.is_type, 10);
                var typeLabel = panTypeMap[isTypeNum] || item.pantype || '网盘资源';
                var rawTime = item.datetime || item.time || item.date || item.create_time || item.created_at || '';
                var timeStr = '';
                if (rawTime) {
                    timeStr = rawTime.substring(0, 19).replace('T', ' ');
                    if (timeStr.indexOf('0000-') === 0 || timeStr.indexOf('0001-') === 0) {
                        var now = new Date();
                        timeStr = now.getFullYear() + '-' + 
                                 String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                                 String(now.getDate()).padStart(2, '0') + ' ' +
                                 String(now.getHours()).padStart(2, '0') + ':' +
                                 String(now.getMinutes()).padStart(2, '0') + ':' +
                                 String(now.getSeconds()).padStart(2, '0');
                    }
                }
                if (!timeStr && item.source) {
                    timeStr = item.source;
                }
                
                // 判断是否本地资源
                var isLocalResource = item.source === '本地资源';
                var localTag = isLocalResource ? '<span class="search-result-tag local" style="background: linear-gradient(135deg, #ff6b6b, #ff8e8e); color: #fff;">本地资源</span>' : '';
                
                // 链接有效性检测状态标识
                var checkStatusHtml = '<span class="search-result-tag link-check-status" data-url="' + (item.url || '') + '" data-index="' + index + '" style="background: #f5f5f5; color: #666; font-size: 11px; padding: 2px 8px;">';
                checkStatusHtml += '<span class="check-icon" style="display: inline-block; width: 10px; height: 10px; margin-right: 4px; border: 2px solid #999; border-top-color: transparent; border-radius: 50%; animation: linkCheckRotate 1s linear infinite;"></span>';
                checkStatusHtml += '<span class="check-text">检测中</span>';
                checkStatusHtml += '</span>';
                
                var html = '<div class="search-result-item" data-index="' + index + '" onclick="getResource(event, ' + index + ')" style="animation: fadeIn 0.3s ease;">';
                html += '<div class="search-result-info">';
                html += '<div class="search-result-name">' + title + '</div>';
                if (desc) {
                    html += '<div class="search-result-desc">' + desc + '</div>';

                html += '<div class="search-result-meta">';
                html += '<span class="search-result-tag type"><i class="iconfont icon-yunpan" style="font-size:12px;"></i>' + typeLabel + '</span>';
                html += localTag;
                html += checkStatusHtml;
                if (timeStr) {
                    html += '<span class="search-result-tag source">' + timeStr + '</span>';

                if (isTypeNum === 11 && window.searchModule && typeof window.searchModule.novelActionsHtml === 'function') {
                    // 小说项：按小说服务后台配置渲染按钮（逐盘"存入XX网盘"或"下载"）

            // 添加淡入动画样式

                document.head.appendChild(style);

            // 添加链接检测动画样式
            if (!document.getElementById('linkCheckAnimations')) {
                var linkCheckStyle = document.createElement('style');
                linkCheckStyle.id = 'linkCheckAnimations';
                linkCheckStyle.textContent = `
                    @keyframes linkCheckRotate {

                    .link-check-status {

                    }

                        color: #ff4d4f !important;

                    }
                    .link-check-status.invalid .check-icon {
                        animation: none !important;
                        border: none !important;
                        width: auto !important;

                    .link-check-status.invalid .check-text::before {
                        content: '✗ ';
                    }
                    .link-check-status.error {
                        background: #fffbe6 !important;
                        color: #faad14 !important;
                        border: 1px solid #ffe58f;
                    }
                    .link-check-status.error .check-icon {
                        animation: none !important;
                        border: none !important;
                        width: auto !important;
                        height: auto !important;
                    }
                    .link-check-status.error .check-text::before {
                        content: '! ';
                    }
                `;
                document.head.appendChild(linkCheckStyle);
            }
            
            // 渲染搜索结果 - SSE全网搜数据
            window.renderSearchResults = function(data, cachedCheckResults) {
                var content = document.getElementById('searchResultContent');
                var html = '<div class="search-result-list">';
                
                data.forEach(function(item, index) {
                    html += window.renderSearchResultItem(item, index);
                });
                
                html += '</div>';
                content.innerHTML = html;
                window.currentSearchData = data;
                
                // 如果有缓存的检测结果，立即应用
                if (cachedCheckResults && Object.keys(cachedCheckResults).length > 0) {
                    setTimeout(function() {
                        applyCachedCheckResults(cachedCheckResults);
                    }, 100);
                }
            };
            
            // 增量渲染单条结果（用于逐步显示）
            window.appendSearchResult = function(item, index) {
                var content = document.getElementById('searchResultContent');
                var list = content.querySelector('.search-result-list');
                
                // 如果没有列表容器，创建一个
                if (!list) {
                    content.innerHTML = '<div class="search-result-list"></div>';
                    list = content.querySelector('.search-result-list');
                }
                
                // 追加新项
                list.insertAdjacentHTML('beforeend', window.renderSearchResultItem(item, index));
                
                // 更新数据缓存
                if (!window.currentSearchData) {
                    window.currentSearchData = [];
                }
                window.currentSearchData.push(item);
            };
            
            // ==================== 链接有效性检测功能 ====================
            
            // 检测状态标志
            window.isCheckingLinks = false;
            window.shouldStopChecking = false;
            
            // 停止当前检测
            window.stopLinkChecking = function() {
                if (window.isCheckingLinks) {
                    window.shouldStopChecking = true;
                }
            };
            
            // 应用缓存的检测结果到UI
            function applyCachedCheckResults(cachedResults) {
                var content = document.getElementById('searchResultContent');
                if (!content) return;
                
                var statusElements = content.querySelectorAll('.link-check-status');
                statusElements.forEach(function(el) {
                    var url = el.getAttribute('data-url');
                    if (url && cachedResults[url]) {
                        updateLinkStatus(el, cachedResults[url]);
                    }
                });
            }
            
            // 逐条检测搜索结果的链接
            window.batchCheckLinksForSearchResults = async function() {
                // 如果正在检测，先停止之前的
                if (window.isCheckingLinks) {
                    window.stopLinkChecking();
                    // 等待一小段时间让之前的检测停止
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
                
                // 重置停止标志
                window.shouldStopChecking = false;
                
                var content = document.getElementById('searchResultContent');
                if (!content) return;
                
                var statusElements = content.querySelectorAll('.link-check-status');
                if (statusElements.length === 0) return;
                
                // 收集所有链接和对应的元素（跳过已检测完成的链接）
                var checkItems = [];
                
                statusElements.forEach(function(el) {
                    var url = el.getAttribute('data-url');
                    // 检查是否已经检测完成（通过检查状态类名 valid 或 invalid）
                    var isChecked = el.classList.contains('valid') ||
                                   el.classList.contains('invalid') ||
                                   el.classList.contains('error');

                    if (url && !isChecked) {
                        checkItems.push({
                            url: url,
                            element: el
                        });
                    }
                });
                
                if (checkItems.length === 0) return;
                
                // 设置检测标志
                window.isCheckingLinks = true;

                try {
                    // 逐条检测
                    for (var i = 0; i < checkItems.length; i++) {
                        // 检查是否需要停止
                        if (window.shouldStopChecking) {
                            break;
                        }

                        // 检查是否还在当前页面（防止页面已切换）
                        var currentContent = document.getElementById('searchResultContent');
                        if (!currentContent) {
                            break;
                        }

                        var item = checkItems[i];

                        // 检测单条链接
                        await checkSingleLink(item.url, item.element);

                        // 添加小延迟，避免请求过快
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                } finally {
                    // 无论成功失败，都重置标志
                    window.isCheckingLinks = false;
                    window.shouldStopChecking = false;
                }
            };
            
            // 解密链接
            async function decryptUrl(encryptedUrl) {
                try {
                    var response = await axios.post('/api/other/save_url', {
                        url: encodeURIComponent(encryptedUrl),
                        title: ''
                    });
                    if (response.data.code == 200 && response.data.data && response.data.data.url) {
                        return response.data.data.url;
                    }
                    return null;
                } catch (error) {
                    return null;
                }
            }
            
            // 判断链接是否需要解密
            function needsDecryption(url) {
                if (!url) return false;
                if (url.startsWith('http') || url.startsWith('magnet:')) return false;
                return true;
            }
            
            // 检测单条链接
            async function checkSingleLink(url, element) {
                try {
                    var checkUrl = url;
                    
                    // 检查链接是否需要解密
                    if (needsDecryption(url)) {
                        var decryptedUrl = await decryptUrl(url);
                        if (decryptedUrl) {
                            checkUrl = decryptedUrl;
                        } else {
                            updateLinkStatus(element, { valid: null, error: '链接解密失败' });
                            return;
                        }
                    } else {
                    }

                    var response = await fetch('/panchek/api.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ links: [checkUrl] })
                    });

                    if (!response.ok) {
                        throw new Error('API 请求失败: ' + response.status);
                    }

                    var data = await response.json();

                    if (data.success && data.results && data.results.length > 0) {
                        var result = data.results[0];
                        updateLinkStatus(element, result);
                        
                        // 更新缓存中的检测结果
                        if (keyword.value && currentPanType) {
                            updateSearchCacheCheckResults(keyword.value, currentPanType, url, { valid: result.valid });
                        }
                    } else {
                        updateLinkStatus(element, { valid: null, error: '返回数据错误' });
                        // 更新缓存中的检测结果
                        if (keyword.value && currentPanType) {
                            updateSearchCacheCheckResults(keyword.value, currentPanType, url, { valid: null, error: '返回数据错误' });
                        }
                    }
                } catch (error) {
                    updateLinkStatus(element, { valid: null, error: '检测失败' });

            // 更新链接状态显示

                if (!element) {
                    return;

                var textEl = element.querySelector('.check-text');
                if (!textEl) {
                    return;
                }
                
                // 清除所有状态类名
                element.classList.remove('valid', 'invalid', 'error');
                
                if (result.valid === true) {
                    element.classList.add('valid');
                    textEl.textContent = '有效';
                } else if (result.valid === false) {
                    element.classList.add('invalid');
                    textEl.textContent = '失效';
                    // 隐藏整条搜索记录
                    var searchItem = element.closest('.search-result-item');
                    if (searchItem) {
                        searchItem.style.display = 'none';
                        // 更新搜索结果数量
                        updateSearchResultCount();
                    }
                } else {
                    element.classList.add('error');
                    textEl.textContent = '检测失败';
                }
            }
            
            // 更新搜索结果数量显示

                if (!content) return;
                
                // 获取所有搜索结果项
                var allItems = content.querySelectorAll('.search-result-item');
                var visibleItems = content.querySelectorAll('.search-result-item:not([style*="display: none"])');
                
                var totalCount = allItems.length;
                var visibleCount = visibleItems.length;
                var hiddenCount = totalCount - visibleCount;
                
                // 计算本地资源数量
                var localCount = 0;
                visibleItems.forEach(function(item) {
                    if (item.classList.contains('local-result')) {
                        localCount++;
                    }
                });
                
                var localText = localCount > 0 ? '（含' + localCount + '条本地）' : '';

                    return;
                }
                // 小说按盘按钮：携带被点按钮的网盘类型，仅转存对应网盘
