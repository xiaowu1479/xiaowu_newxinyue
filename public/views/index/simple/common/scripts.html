    const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;
    const { ElButton, ElMessage  } = ElementPlus;
    const app = createApp({
        setup() {
            // 定义响应式数据
            const elementOpacity = ref(0);
            const scrollThreshold = ref(150); // 动态设置的滚动阈值
            const keyword = ref('{$keyword??''}');
            const qcodeVisible = ref(false);
            const layerVisible = ref(false);
            const content = ref('');
            const load = ref(false)
            const drawer = ref(false)
            const rankList = ref([]);
            const rankDj = ref([]);
            const is_m = ref(0);
            const newList = ref([]);
            const QList = ref([]);
            const QLoading = ref(false);
            const total_result = ref(0);
            const currentSource = ref(0);
            const dialogUrl = ref(false);
            const dialogLoading = ref(false);
            const dialogItem = ref({});
            if (window.searchModule) {
                window.searchModule.setupResourceDialog({
                    dialogUrl: dialogUrl,
                    dialogLoading: dialogLoading,
                    dialogItem: dialogItem,
                    onShowResource: function() { loadHotKeywords(); }
                });
            }
            const is_type = ref(0);
            const pc_type = ref(0);
            const panTypeMap = ref(<?php echo json_encode($panTypeMap ?? [], JSON_UNESCAPED_UNICODE); ?>);
            
            // TMDB 影视信息
            const tmdbData = ref({});
            const tmdbLoading = ref(false);

            // 首页公告弹窗
            const noticeVisible = ref(false);
            const noticeImage = ref({:json_encode($config.notice_image ?? '')});
            const noticeText = ref({:json_encode($config.notice_text ?? '')});
            const dismissNotice = () => {
                const sevenDays = 7 * 24 * 60 * 60 * 1000;
                localStorage.setItem('notice_dismiss_until', String(Date.now() + sevenDays));
                noticeVisible.value = false;
            };

            // 热搜词
            const hotKeywords = ref([]);
            const loadHotKeywords = async function() {
                try {
                    const response = await axios.get('/api/other/get_hot_keywords?limit=10');
                    if (response.data.code === 200 && response.data.data && response.data.data.items) {
                        hotKeywords.value = response.data.data.items;
                    }
                } catch (e) {
                    hotKeywords.value = [];
                }
            };
            // 点击热搜词搜索
            const searchHotKeyword = function(kw) {
                keyword.value = kw;
                if (typeof searchBtn === 'function') {
                    searchBtn();
                } else if (window.app && window.app.searchBtn) {
                    window.app.searchBtn();
                }
            };

            // 分类热搜 - 从后台 SourceCategory 动态获取，按 is_type 选择数据源
            // is_type=0: 网络资源（夸克 API），is_type=1: 本地资源（localRanking）
            const hotCategories = ref([]);
            const hotCategoryData = ref({});
            const loadHotCategories = function() {
                axios.get('/api/search/getCategory').then(function(res) {
                    if (res.data && res.data.data && Array.isArray(res.data.data)) {
                        // 按 sort desc 排序已由后端处理
                        var cats = res.data.data.map(function(c) {
                            return {
                                channel: c.name,
                                label: c.name,
                                is_type: c.is_type || 0
                            };
                        });
                        hotCategories.value = cats;
                        // 逐个分类加载榜单数据
                        cats.forEach(function(cat) {
                            var params = { channel: cat.channel, rank_type: '热搜榜', page_size: 12 };
                            if (cat.is_type === 1) {
                                params.source = 'local';
                            }
                            axios.get('/api/tool/ranking', { params: params })
                                .then(function(r) {
                                    if (r.data && r.data.data) {
                                        var list = r.data.data.data || r.data.data || [];
                                        if (!Array.isArray(list)) list = [];
                                        hotCategoryData.value[cat.channel] = list;
                                        hotCategoryData.value = Object.assign({}, hotCategoryData.value);
                                    }
                                }).catch(function() {});
                        });
                    }
                }).catch(function() {});
            };
            // 默认封面 SVG - 随白天/黑夜模式切换
            const darkCoverSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3Crect width='300' height='400' fill='%23141E2E'/%3E%3Crect x='80' y='130' width='140' height='180' rx='8' fill='none' stroke='%23E8A547' stroke-width='2' opacity='0.4'/%3E%3Ccircle cx='150' cy='180' r='24' fill='none' stroke='%23E8A547' stroke-width='2' opacity='0.5'/%3E%3Cpath d='M150 170 a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20' fill='%23E8A547' opacity='0.4'/%3E%3Cpath d='M120 300 Q150 260 180 300 L180 310 L120 310 Z' fill='%23E8A547' opacity='0.3'/%3E%3Ctext x='150' y='350' text-anchor='middle' fill='%238B9BB4' font-size='14' font-family='sans-serif'%3E%E6%97%A0%E5%B0%81%E9%9D%A2%3C/text%3E%3C/svg%3E";
            const lightCoverSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3Crect width='300' height='400' fill='%23FAF7F0'/%3E%3Crect x='80' y='130' width='140' height='180' rx='8' fill='none' stroke='%23C8881E' stroke-width='2' opacity='0.4'/%3E%3Ccircle cx='150' cy='180' r='24' fill='none' stroke='%23C8881E' stroke-width='2' opacity='0.5'/%3E%3Cpath d='M150 170 a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20' fill='%23C8881E' opacity='0.4'/%3E%3Cpath d='M120 300 Q150 260 180 300 L180 310 L120 310 Z' fill='%23C8881E' opacity='0.3'/%3E%3Ctext x='150' y='350' text-anchor='middle' fill='%236B6557' font-size='14' font-family='sans-serif'%3E%E6%97%A0%E5%B0%81%E9%9D%A2%3C/text%3E%3C/svg%3E";
            const defaultCover = computed(() => currentTheme.value === 'light' ? lightCoverSvg : darkCoverSvg);
            // 图片加载失败时替换为默认封面
            const onCoverError = function(e) {
                e.target.src = defaultCover.value;
            };
            // 点击分类热搜卡片 -> 本地数据直接显示弹窗，网络数据用标题搜索
            const searchByTitle = function(title) {
                if (typeof window.searchByKeyword === 'function') {
                    window.searchByKeyword(title);
                }
            };
            // Banner 点击：有 link 跳外链，无 link 用 name 搜索
            const bannerClick = function(item) {
                // 触摸滑动后浏览器仍可能派发 click，需阻止
                if (bannerTouchMoved) {
                    bannerTouchMoved = false;
                    return;
                }
                if (item && item.link) {
                    window.open(item.link, '_blank');
                } else if (item && item.name) {
                    searchByTitle(item.name);
                }
            };
            // 分类热搜卡片点击：本地数据(is_type=1)直接显示资源弹窗，网络数据用标题搜索
            const showHotCategoryResource = function(item, cat) {
                if (cat.is_type === 1) {
                    // 本地数据：弹窗显示链接
                    if (item.id) {
                        axios.post('/api/search/incrementViews', { id: item.id }).catch(function() {});
                    }
                    dialogLoading.value = true;
                    dialogUrl.value = true;
                    dialogItem.value = {};
                    var rawUrl = item.url || '';
                    if (rawUrl && (rawUrl.startsWith('http') || rawUrl.startsWith('magnet:'))) {
                        item.showUrl = rawUrl;
                        showResourceDialog(item);
                    } else if (rawUrl) {
                        axios.post('/api/other/save_url', {
                            url: encodeURIComponent(rawUrl),
                            title: item.title
                        }).then(function(res) {
                            if (res.data.code == 200) {
                                item.showUrl = res.data.data.url || '';
                            } else {
                                item.showUrl = '';
                                item.message = res.data.message || '获取失败';
                            }
                            showResourceDialog(item);
                        }).catch(function() {
                            item.showUrl = '';
                            item.message = '网络错误，请重试';
                            showResourceDialog(item);
                        });
                    } else {
                        item.showUrl = '';
                        item.message = '暂无资源链接';
                        showResourceDialog(item);
                    }
                } else {
                    // 网络数据：用标题搜索
                    searchByTitle(item.title);
                }
            };

            // 首页 Banner 轮播（读取 banner 目录所有图片）
            const bannerList = ref(window.__BANNER_LIST || []);
            const bannerIndex = ref(0);
            let bannerTimer = null;
            const stopBannerAuto = function() {
                if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
            };
            const startBannerAuto = function() {
                stopBannerAuto();
                if (bannerList.value.length > 1) {
                    bannerTimer = setInterval(function() {
                        bannerIndex.value = (bannerIndex.value + 1) % bannerList.value.length;
                    }, 5000);
                }
            };
            const bannerGo = function(i) {
                if (!bannerList.value.length) return;
                bannerIndex.value = (i + bannerList.value.length) % bannerList.value.length;
                startBannerAuto();
            };

            // 触摸滑动支持（移动端）
            let bannerTouchStartX = 0;
            let bannerTouchStartY = 0;
            let bannerTouchStartTime = 0;
            let bannerTouchMoved = false;
            const onBannerTouchStart = function(e) {
                if (bannerList.value.length <= 1) return;
                var touch = e.touches[0];
                bannerTouchStartX = touch.clientX;
                bannerTouchStartY = touch.clientY;
                bannerTouchStartTime = Date.now();
                bannerTouchMoved = false;
                stopBannerAuto();
            };
            const onBannerTouchEnd = function(e) {
                if (bannerList.value.length <= 1) return;
                var touch = e.changedTouches[0];
                var deltaX = touch.clientX - bannerTouchStartX;
                var deltaY = touch.clientY - bannerTouchStartY;
                var elapsed = Date.now() - bannerTouchStartTime;
                var SWIPE_THRESHOLD = 40;
                // 横向为主、距离超过阈值、时长合理 → 触发翻页
                if (Math.abs(deltaX) > SWIPE_THRESHOLD && Math.abs(deltaX) > Math.abs(deltaY) * 1.5 && elapsed < 800) {
                    var len = bannerList.value.length;
                    var newIndex = deltaX > 0
                        ? (bannerIndex.value - 1 + len) % len   // 右滑：上一张
                        : (bannerIndex.value + 1) % len;          // 左滑：下一张
                    bannerGo(newIndex);   // 内部会重启自动播放
                    bannerTouchMoved = true;
                } else {
                    startBannerAuto();   // 未触发翻页，恢复自动播放
                }
            };

            // 白天/黑夜模式切换
            const currentTheme = ref('dark');
            const themeSwitcherRef = ref(null);

            // 切换白天/黑夜
            const toggleTheme = () => {
                const next = currentTheme.value === 'dark' ? 'light' : 'dark';
                currentTheme.value = next;
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('app-theme', next);
            };

            // 初始化主题（兼容旧值：blue/red/green -> dark）
            const initTheme = () => {
                let defaultTheme = '{$config.simple_default_theme}' || 'dark';
                if (defaultTheme !== 'dark' && defaultTheme !== 'light') defaultTheme = 'dark';
                let savedTheme = localStorage.getItem('app-theme') || defaultTheme;
                if (savedTheme !== 'dark' && savedTheme !== 'light') savedTheme = defaultTheme;
                currentTheme.value = savedTheme;
                document.documentElement.setAttribute('data-theme', savedTheme);
            };
            
            // 公共消息方法
            const showMessage = (message, type = 'info') => {
                ElMessage({
                    message,
                    type,
                    plain: true,
                });
            };


             // 滚动监听方法
            const handleScroll = () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                elementOpacity.value = scrollTop >= scrollThreshold.value
                    ? Math.min((scrollTop - scrollThreshold.value) / 100, 1)
                    : Math.max(1 - (scrollThreshold.value - scrollTop) / 100, 0);
    
                const boxElement = document.querySelector('.listBox .screen .fixed .box');
                if (boxElement && boxElement.style.display === 'block' && is_m.value) {
                    boxElement.style.display = 'none';
                }
            };

            // 选中线路缓存键
            const SELECTED_PAN_TYPE_KEY = 'selected_pan_type';

            // 读取选中的线路类型（提前定义，避免初始化时访问不到）
            const getSelectedPanType = () => {
                try {
                    return localStorage.getItem(SELECTED_PAN_TYPE_KEY);
                } catch (e) {
                    return null;
                }
            };

            // 获取可用的线路类型（转换为字符串数组）
            var availablePanTypes = <?php echo json_encode(array_keys($panTypeMap ?? []), JSON_UNESCAPED_UNICODE); ?>.map(String);
            // 默认选中排序第一的线路
            var defaultPanType = String(availablePanTypes[0] || '9');
            // 尝试读取保存的选中状态
            var savedPanType = getSelectedPanType();
            // 当前选中的网盘类型，优先使用保存的状态，否则使用默认值
            var currentPanType = (savedPanType && availablePanTypes.includes(savedPanType)) ? savedPanType : defaultPanType;
            const searchState = window.searchModule.createDialogState(keyword, {
                validateKeywordOnSearch: false,
                selectPanAndSearchMode: 'toggle',
                getDefaultPanType: function() { return [currentPanType || defaultPanType || '']; },
                onEmptyKeyword: function() { showMessage('请输入你要搜索的内容~', 'error'); },
                onEmptyPanType: function() { showMessage('请至少选择一条线路~', 'error'); },
                onSelectPanType: function(panTypes) {
                    currentPanType = Array.isArray(panTypes) && panTypes.length > 0 ? panTypes[0] : (panTypes || '');
                    saveSelectedPanType(currentPanType);
                },
                stopSearch: function() {
                    window.searchModule.stopSearch();
                    if (currentEventSource) {
                        try { currentEventSource.close(); } catch (e) {}
                        currentEventSource = null;
                    }
                },
                doSearch: function(panTypes) { return window.searchModule.doSearch(keyword.value, panTypes); }
            });
            const searchBtn = searchState.searchBtn;
            const searchDialogVisible = searchState.searchDialogVisible;
            const searchDialogStage = searchState.searchDialogStage;
            const searchSelectedPanType = searchState.searchSelectedPanType;
            const openSearchDialog = searchState.openSearchDialog;
            const selectPanAndSearch = searchState.selectPanAndSearch;
            const startMultiSearch = searchState.startMultiSearch;
            const selectAllPanTypes = searchState.selectAllPanTypes;
            const clearPanTypes = searchState.clearPanTypes;
            const resultFilterPanType = searchState.resultFilterPanType;
            const availableResultTabs = searchState.availableResultTabs;
            const setResultFilterPanType = searchState.setResultFilterPanType;
            const backToSelectPanType = searchState.backToSelectPanType;
            const onDialogKeywordEnter = searchState.onDialogKeywordEnter;
            var searchResults = [];
            var currentEventSource = null;

            // 搜索结果缓存配置（10分钟）
            const SEARCH_CACHE_DURATION = 10 * 60 * 1000; // 10分钟

            // 获取搜索结果缓存
            const getSearchCache = (query, panType) => {
                try {
                    const cacheKey = 'search_cache_' + encodeURIComponent(query) + '_' + panType;
                    const cacheData = localStorage.getItem(cacheKey);
                    if (cacheData) {
                        const { data, timestamp, type, checkResults } = JSON.parse(cacheData);
                        if (Date.now() - timestamp < SEARCH_CACHE_DURATION) {
                            return { data: data, type: type, checkResults: checkResults || {} };
                        }
                    }
                } catch (e) {
                }
                return null;
            };

            // 保存搜索结果缓存
            const setSearchCache = (query, panType, data, checkResults) => {
                try {
                    const cacheKey = 'search_cache_' + encodeURIComponent(query) + '_' + panType;
                    const cacheData = {
                        data: data,
                        type: panType,
                        timestamp: Date.now(),
                        checkResults: checkResults || {}
                    };
                    localStorage.setItem(cacheKey, JSON.stringify(cacheData));
                } catch (e) {
                }
            };
            
            // 更新缓存中的检测结果
            const updateSearchCacheCheckResults = (query, panType, url, result) => {
                try {
                    const cacheKey = 'search_cache_' + encodeURIComponent(query) + '_' + panType;
                    const cacheData = localStorage.getItem(cacheKey);
                    if (cacheData) {
                        const parsed = JSON.parse(cacheData);
                        if (!parsed.checkResults) {
                            parsed.checkResults = {};
                        }
                        parsed.checkResults[url] = result;
                        localStorage.setItem(cacheKey, JSON.stringify(parsed));
                    }
                } catch (e) {
                }
            };

            // 清空搜索结果缓存
            const clearSearchCache = (query, panType) => {
                try {
                    const cacheKey = 'search_cache_' + encodeURIComponent(query) + '_' + panType;
                    localStorage.removeItem(cacheKey);
                } catch (e) {
                }
            };
            
            // 清空所有搜索结果缓存
            const clearAllSearchCache = () => {
                try {
                    const keysToRemove = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('search_cache_')) {
                            keysToRemove.push(key);
                        }
                    }
                    keysToRemove.forEach(key => localStorage.removeItem(key));
                    return keysToRemove.length;
                } catch (e) {
                    return 0;
                }
            };
            
            // 暴露清除缓存函数到全局
            window.clearAllSearchCache = clearAllSearchCache;

            // 保存选中的线路类型
            const saveSelectedPanType = (panType) => {
                try {
                    localStorage.setItem(SELECTED_PAN_TYPE_KEY, panType);
                } catch (e) {
                }
            };

            // 本地搜索结果存储
            var localSearchResults = [];
            var hasLocalData = false;

            // 检查本地资源
            const checkLocalResources = async (query, isType) => {
                try {
                    var params = { title: query };
                    // 如果指定了线路类型且不是本地资源类型，则添加类型过滤
                    if (isType && isType !== '' && isType !== 'local') {
                        params.is_type = isType;
                    }
                    const response = await axios.get('/api/other/local_search_check', {
                        params: params,
                        timeout: 5000
                    });
                    if (response.data && response.data.code === 200) {
                        return {
                            hasData: response.data.data.hasData,
                            count: response.data.data.count || 0,
                            items: response.data.data.items || []
                        };
                    }
                } catch (e) {
                }
                return { hasData: false, count: 0, items: [] };
            };

            // 显示/隐藏本地资源按钮（已废弃，本地资源直接显示在搜索结果中）
            const toggleLocalSearchButton = (show) => {
                // 本地资源按钮已移除，此函数保留用于兼容
            };

            // 页面加载时设置默认选中状态
            document.addEventListener('DOMContentLoaded', function() {
                // 设置桌面端标签选中
                var desktopTabs = document.querySelectorAll('.pan-type-tab');
                desktopTabs.forEach(function(tab) {
                    if (tab.getAttribute('data-type') === currentPanType) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
                // 设置移动端下拉列表选中
                var mobileSelect = document.querySelector('.pan-type-select');
                if (mobileSelect) {
                    mobileSelect.value = currentPanType;
                }
                
                // 三连击清除缓存功能
                var clearCacheIcon = document.getElementById('clearCacheIcon');
                if (clearCacheIcon) {
                    var clickCount = 0;
                    var clickTimer = null;
                    
                    clearCacheIcon.addEventListener('click', function() {
                        clickCount++;
                        
                        if (clickCount === 1) {
                            // 第一次点击，启动计时器
                            clickTimer = setTimeout(function() {
                                // 超时重置
                                clickCount = 0;
                            }, 500); // 500ms 内完成三连击
                        } else if (clickCount === 3) {
                            // 三连击成功
                            clearTimeout(clickTimer);
                            clickCount = 0;
                            
                            // 执行清除缓存
                            var count = clearAllSearchCache();
                            
                            // 显示提示
                            var toast = document.createElement('div');
                            toast.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 16px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: fadeIn 0.3s ease;';
                            toast.textContent = '已清除 ' + count + ' 条缓存';
                            document.body.appendChild(toast);
                            
                            setTimeout(function() {
                                toast.style.opacity = '0';
                                toast.style.transition = 'opacity 0.3s ease';
                                setTimeout(function() {
                                    document.body.removeChild(toast);
                                }, 300);
                            }, 1500);
                        }
                    });
                }
            });

            // 更新搜索统计数据
            window.updateSearchStats = function() {
                fetch('/api/other/get_search_stats')
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(res) {
                        if (res.code === 200 && res.data) {
                            // 更新今日搜索
                            var todayEl = document.querySelector('.stat-item:nth-child(1) .stat-value');
                            if (todayEl) {
                                todayEl.textContent = res.data.today_formatted;
                            }
                            // 更新总搜索量
                            var totalEl = document.querySelector('.stat-item:nth-child(2) .stat-value');
                            if (totalEl) {
                                totalEl.textContent = res.data.total_formatted;
                            }
                        }
                    })
                    .catch(function(err) {
                    });
            };

            // 更新搜索耗时显示
            window.updateSearchDuration = function() {
                if (window.searchStartTime) {
                    var durationMs = Date.now() - window.searchStartTime;
                    var durationSec = (durationMs / 1000).toFixed(2);
                    var loadTimeEl = document.getElementById('searchDuration');
                    if (loadTimeEl) {
                        loadTimeEl.textContent = durationSec + 's';
                    }
                }
            };

            // 切换网盘类型

            // ==================== 链接有效性检测功能 ====================
            
            // 检测状态标志
            window.isCheckingLinks = false;
            window.shouldStopChecking = false;
            
            // 停止当前检测
            window.stopLinkChecking = function() {
                if (window.isCheckingLinks) {
                    window.shouldStopChecking = true;
                }
            };
            
            // 应用缓存的检测结果到UI
            function applyCachedCheckResults(cachedResults) {
                var content = document.getElementById('searchResultContent');
                if (!content) return;
                
                var statusElements = content.querySelectorAll('.link-check-status');
                statusElements.forEach(function(el) {
                    var url = el.getAttribute('data-url');
                    if (url && cachedResults[url]) {
                        updateLinkStatus(el, cachedResults[url]);
                    }
                });
            }
            
            // 逐条检测搜索结果的链接
            window.batchCheckLinksForSearchResults = async function() {
                // 后台「检测资源」开关关闭时不进行检测
                if (!window.__linkCheckEnabled) return;

                // 如果正在检测，先停止之前的
                if (window.isCheckingLinks) {
                    window.stopLinkChecking();
                    // 等待一小段时间让之前的检测停止
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
                
                // 重置停止标志
                window.shouldStopChecking = false;
                
                var content = document.getElementById('searchResultContent');
                if (!content) return;
                
                var statusElements = content.querySelectorAll('.link-check-status');
                if (statusElements.length === 0) return;
                
                // 收集所有链接和对应的元素（跳过已检测完成的链接）
                var checkItems = [];
                
                statusElements.forEach(function(el) {
                    var url = el.getAttribute('data-url');
                    // 检查是否已经检测完成（通过检查状态类名 valid 或 invalid）
                    var isChecked = el.classList.contains('valid') ||
                                   el.classList.contains('invalid') ||
                                   el.classList.contains('error');

                    if (url && !isChecked) {
                        checkItems.push({
                            url: url,
                            element: el
                        });
                    }
                });
                
                if (checkItems.length === 0) return;
                
                // 设置检测标志
                window.isCheckingLinks = true;

                try {
                    // 逐条检测
                    for (var i = 0; i < checkItems.length; i++) {
                        // 检查是否需要停止
                        if (window.shouldStopChecking) {
                            break;
                        }

                        // 检查是否还在当前页面（防止页面已切换）
                        var currentContent = document.getElementById('searchResultContent');
                        if (!currentContent) {
                            break;
                        }

                        var item = checkItems[i];

                        // 检测单条链接
                        await checkSingleLink(item.url, item.element);

                        // 添加小延迟，避免请求过快
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                } finally {
                    // 无论成功失败，都重置标志
                    window.isCheckingLinks = false;
                    window.shouldStopChecking = false;
                }
            };
            
            // 解密链接
            async function decryptUrl(encryptedUrl) {
                try {
                    var response = await axios.post('/api/other/save_url', {
                        url: encodeURIComponent(encryptedUrl),
                        title: ''
                    });
                    if (response.data.code == 200 && response.data.data && response.data.data.url) {
                        return response.data.data.url;
                    }
                    return null;
                } catch (error) {
                    return null;
                }
            }
            
            // 判断链接是否需要解密
            function needsDecryption(url) {
                if (!url) return false;
                if (url.startsWith('http') || url.startsWith('magnet:')) return false;
                return true;
            }
            
            // 检测单条链接
            async function checkSingleLink(url, element) {
                try {
                    var checkUrl = url;
                    
                    // 检查链接是否需要解密
                    if (needsDecryption(url)) {
                        var decryptedUrl = await decryptUrl(url);
                        if (decryptedUrl) {
                            checkUrl = decryptedUrl;
                        } else {
                            updateLinkStatus(element, { valid: null, error: '链接解密失败' });
                            return;
                        }
                    } else {
                    }

                    var response = await fetch('/panchek/api.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ links: [checkUrl] })
                    });

                    if (!response.ok) {
                        throw new Error('API 请求失败: ' + response.status);
                    }

                    var data = await response.json();

                    if (data.success && data.results && data.results.length > 0) {
                        var result = data.results[0];
                        updateLinkStatus(element, result);
                        
                        // 更新缓存中的检测结果
                        if (keyword.value && currentPanType) {
                            updateSearchCacheCheckResults(keyword.value, currentPanType, url, { valid: result.valid });
                        }
                    } else {
                        updateLinkStatus(element, { valid: null, error: '返回数据错误' });
                        // 更新缓存中的检测结果
                        if (keyword.value && currentPanType) {
                            updateSearchCacheCheckResults(keyword.value, currentPanType, url, { valid: null, error: '返回数据错误' });
                        }
                    }
                } catch (error) {
                    updateLinkStatus(element, { valid: null, error: '检测失败' });
                    // 更新缓存中的检测结果
                    if (keyword.value && currentPanType) {
                        updateSearchCacheCheckResults(keyword.value, currentPanType, url, { valid: null, error: '检测失败' });
                    }
                }
            }
            
            // 更新链接状态显示
            function updateLinkStatus(element, result) {
                if (!element) {
                    return;
                }

                var textEl = element.querySelector('.check-text');
                if (!textEl) {
                    return;
                }
                
                // 清除所有状态类名
                element.classList.remove('valid', 'invalid', 'error');
                
                if (result.valid === true) {
                    element.classList.add('valid');
                    textEl.textContent = '有效';
                } else if (result.valid === false) {
                    element.classList.add('invalid');
                    textEl.textContent = '失效';
                    // 隐藏整条搜索记录
                    var searchItem = element.closest('.search-result-item');
                    if (searchItem) {
                        searchItem.style.display = 'none';
                        // 更新搜索结果数量
                        updateSearchResultCount();
                    }
                } else {
                    element.classList.add('error');
                    textEl.textContent = '检测失败';
                }
            }

                    // 手机端的逻辑
                    is_m.value = 1
                    pc_type.value = 1
                } else {
                    // 电脑端的逻辑
                    is_m.value = 0
                    pc_type.value = parseInt('{$config.pc_type}') || 0;
                }
            };


            // 组件挂载时添加滚动监听
            onMounted(() => {
                handleDeviceType();
                initTheme(); // 初始化主题

                // 加载热搜词
                loadHotKeywords();

                // 加载分类热搜卡片
                loadHotCategories();

                // 启动 Banner 轮播
                startBannerAuto();

                // 从URL参数读取搜索关键词并自动搜索
                const urlParams = new URLSearchParams(window.location.search);
                const wd = urlParams.get('wd');
                if (wd) {
                    keyword.value = decodeURIComponent(wd);
                    // 延迟执行搜索，确保页面完全加载
                    setTimeout(() => {
                        searchBtn();
                    }, 100);
                } else {
                    // 如果没有URL参数，显示最后一次缓存的TMDB数据
                    const lastQuery = localStorage.getItem('tmdb_last_query');
                    if (lastQuery) {
                        const cacheKey = 'tmdb_cache_' + lastQuery;
                        const cacheData = localStorage.getItem(cacheKey);
                        if (cacheData) {
                            try {
                                const parsed = JSON.parse(cacheData);
                                const data = parsed.data || parsed;
                                if (data && data.title) {
                                    tmdbData.value = data;
                                }
                            } catch (e) {
                            }
                        }
                    }
                }

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('resize', handleDeviceType);

                // 首页公告弹窗：仅首页、有内容、且未在7日内关闭过才显示
                const pathname = window.location.pathname;
                const isHomepage = pathname === '/' || pathname === '/index' || pathname === '/index/index/index';
                if (isHomepage && (noticeImage.value || noticeText.value)) {
                    const dismissUntil = localStorage.getItem('notice_dismiss_until');
                    if (!dismissUntil || Date.now() > parseInt(dismissUntil)) {
                        noticeVisible.value = true;
                    }
                }
            });

            // 组件卸载时移除滚动监听
            onUnmounted(() => {
                window.removeEventListener('scroll', handleScroll);
                window.removeEventListener('resize', handleDeviceType);
                stopBannerAuto();
            });

            // 返回数据和方法
            return { elementOpacity, scrollThreshold, keyword, searchBtn, searchOnly, rankList,newList, setnum, qcodeVisible, layerVisible, content, saveBtn, rankDj,goLink,changeBtn,copyText,copyToClipboard,drawer,selectBtn,is_m,QList,QLoading,total_result,currentSource,dialogUrl,dialogLoading,dialogItem,is_type,pc_type,panTypeMap,getResource,showResourceDialog,showDetail, tmdbData, tmdbLoading, hotKeywords, loadHotKeywords, searchHotKeyword, downloadWithThunder, currentTheme, toggleTheme, hotCategories, hotCategoryData, searchByTitle, bannerClick, showHotCategoryResource, defaultCover, onCoverError, searchDialogVisible, searchDialogStage, searchSelectedPanType, selectPanAndSearch, startMultiSearch, selectAllPanTypes, clearPanTypes, resultFilterPanType, availableResultTabs, setResultFilterPanType, backToSelectPanType, switchPanFromResource, onDialogKeywordEnter, bannerList, bannerIndex, bannerGo, onBannerTouchStart, onBannerTouchEnd, openSearchDialog, noticeVisible, noticeImage, noticeText, dismissNotice };
        }
    })
    .use(ElementPlus)
    .mount('#app');
    document.documentElement.removeAttribute('data-page-loading');
</script>
