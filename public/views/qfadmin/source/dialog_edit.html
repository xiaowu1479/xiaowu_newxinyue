<!-- 修改框 -->
<el-dialog title="修改资源" :visible.sync="dialogFormEdit" :modal-append-to-body='false' append-to-body
    :close-on-click-modal='false' width="780px" custom-class="dialog-edit-source">
    <el-form :model="formEdit" :rules="rules" ref="formEdit" label-width="90px">
        <div class="form-top">
            <div class="form-cover">
                <el-form-item label="" label-width="0">
                    <el-upload
                        class="avatar-uploader"
                        action="/admin/attach/uploadImage"
                        :data="PostBase"
                        :show-file-list="false"
                        :on-success="handleCoverSuccessEdit"
                        :before-upload="beforeCoverUpload">
                        <img v-if="formEdit.vod_pic" :src="formEdit.vod_pic" class="avatar" style="width: 140px; height: 190px; object-fit: cover; border-radius: 6px;">
                        <i v-else class="el-icon-plus avatar-uploader-icon" style="font-size: 28px; color: #8c939d; width: 140px; height: 190px; line-height: 190px; text-align: center; border: 1px dashed #d9d9d9; border-radius: 6px;"></i>
                    </el-upload>
                    <div class="cover-btns">
                        <el-button size="medium" plain icon="el-icon-picture-outline" @click="fetchCoverEdit">获取详情</el-button>
                        <el-button size="medium" plain icon="el-icon-delete" @click="clearCoverEdit">清除封面</el-button>
                    </div>
                </el-form-item>
            </div>
            <div class="form-info">
                <el-form-item prop="title" label="资源名称">
                    <el-input size="medium" autocomplete="off" placeholder="请输入资源名称" v-model="formEdit.title"></el-input>
                </el-form-item>
                <el-form-item prop="url" label="资源地址">
                    <el-input size="medium" autocomplete="off" placeholder="请输入资源地址" v-model="formEdit.url"></el-input>
                </el-form-item>
                <el-form-item prop="account_name" label="账号名称">
                    <el-input size="medium" autocomplete="off" placeholder="请输入账号名称" v-model="formEdit.account_name"></el-input>
                </el-form-item>
                <el-form-item prop="source_category_id" label="资源分类">
                    <el-select size="medium" v-model="formEdit.source_category_id" placeholder="请选择分类" style="width: 100%;" clearable>
                        <el-option v-for="item in category" :key="item.source_category_id" :label="item.name"
                            :value="item.source_category_id">
                        </el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="资源标识">
                    <el-select size="medium" v-model="formEdit.is_top" placeholder="请选择资源标识" style="width: 100%;">
                        <el-option label="普通资源" :value="0"></el-option>
                        <el-option :label="rankNames[0] || '热搜榜'" :value="1"></el-option>
                        <el-option :label="rankNames[1] || '推荐榜'" :value="2"></el-option>
                        <el-option :label="rankNames[2] || '好评榜'" :value="3"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="资源类型">
                    <el-select size="medium" v-model="formEdit.is_time" placeholder="请选择资源类型" style="width: 100%;">
                        <el-option label="永久资源" :value="0"></el-option>
                        <el-option label="临时资源" :value="1"></el-option>
                        <el-option label="外部资源" :value="2"></el-option>
                    </el-select>
                </el-form-item>
            </div>
        </div>
        <div class="form-bottom">
            <el-form-item label="资源介绍" label-width="90px">
                <el-input type="textarea" :rows="5" size="medium" autocomplete="off" placeholder=""
                    v-model="formEdit.vod_content"></el-input>
            </el-form-item>
            <el-form-item label="关键词搜索" label-width="90px">
                <el-input type="textarea" :rows="5" size="medium" autocomplete="off" placeholder="一行一个名称"
                    v-model="formEdit.description"></el-input>
            </el-form-item>
        </div>
    </el-form>
    <div slot="footer" class="dialog-footer">
        <el-button @click="dialogFormEdit = false">取 消</el-button>
        <el-button type="primary" @click="postEdit()">确认修改</el-button>
    </div>
</el-dialog>
