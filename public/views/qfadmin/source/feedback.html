<!DOCTYPE html>
<html>

<head>
    <title>{$node.node_title}</title>
    <link rel="stylesheet" href="/static/admin/css/source-index.css?v={:filemtime(public_path().'static/admin/css/source-index.css')}">
    <style>
        .feedback-panel .feedback-keyword {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            color: #1f2937;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .feedback-time {
            color: #64748b;
            font-variant-numeric: tabular-nums;
        }

        .feedback-hot-table .hot-rank {
            display: inline-flex;
            width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #f1f5f9;
            color: #64748b;
            font-weight: 700;
        }

        .feedback-hot-table .hot-rank.top-1 { background: #fee2e2; color: #dc2626; }
        .feedback-hot-table .hot-rank.top-2 { background: #fef3c7; color: #d97706; }
        .feedback-hot-table .hot-rank.top-3 { background: #dcfce7; color: #16a34a; }

        .feedback-count {
            color: #ef4444;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
    </style>
    {include file="common/header"/}

    <div class="header-actions">
        <el-button type="primary" size="small" icon="el-icon-plus" @click="confirmBatchAdd">添加测试数据</el-button>
        <el-button type="warning" size="small" icon="el-icon-data-line" @click="dialogHotVisible = true" plain>热搜排行</el-button>
        <el-button type="danger" size="small" icon="el-icon-delete" @click="confirmClear" plain>清空记录</el-button>
    </div>

    <el-row :gutter="18" class="kpi-row">
        <el-col :span="6">
            <div class="kpi-card">
                <div class="kpi-icon" style="background:linear-gradient(135deg,#6366f1,#818cf8);"><i class="el-icon-search"></i></div>
                <div>
                    <div class="kpi-label">今日搜索</div>
                    <div class="kpi-value">{{stats.today}}</div>
                </div>
            </div>
        </el-col>
        <el-col :span="6">
            <div class="kpi-card">
                <div class="kpi-icon" style="background:linear-gradient(135deg,#ec4899,#f472b6);"><i class="el-icon-date"></i></div>
                <div>
                    <div class="kpi-label">本周搜索</div>
                    <div class="kpi-value">{{stats.week}}</div>
                </div>
            </div>
        </el-col>
        <el-col :span="6">
            <div class="kpi-card">
                <div class="kpi-icon" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);"><i class="el-icon-files"></i></div>
                <div>
                    <div class="kpi-label">本月搜索</div>
                    <div class="kpi-value">{{stats.month}}</div>
                </div>
            </div>
        </el-col>
        <el-col :span="6">
            <div class="kpi-card">
                <div class="kpi-icon" style="background:linear-gradient(135deg,#10b981,#34d399);"><i class="el-icon-data-line"></i></div>
                <div>
                    <div class="kpi-label">总搜索</div>
                    <div class="kpi-value">{{stats.total}}</div>
                </div>
            </div>
        </el-col>
    </el-row>

    <div class="source-panel feedback-panel">
        <div class="filter-card">
            <el-form :inline="true" @submit.native.prevent class="filter-form">
                <el-form-item style="margin-left: 12px;">
                    <el-input placeholder="输入关键词搜索" size="small" v-model="form.content" @keyup.enter.native="getList_search" style="width:220px;"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-select v-model="form.pan_type" placeholder="全部网盘" clearable size="small" @change="onPanTypeChange" style="width:150px;">
                        <el-option label="全部网盘" value=""></el-option>
                        <el-option v-for="item in panTypes" :key="item.id" :label="item.name" :value="String(item.id)"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item class="compact-btns">
                    <el-button type="primary" icon="el-icon-search" size="small" @click="getList_search">查询</el-button>
                    <el-button icon="el-icon-refresh-left" size="small" @click="resetSearch" plain>重置</el-button>
                    <el-button type="danger" icon="el-icon-delete" size="small" @click="postMultDelete" plain>删除</el-button>
                </el-form-item>
            </el-form>
        </div>

        <div class="list-container">
            <el-table :data="dataList.data" @selection-change="changeSelection" v-loading="loading" stripe>
                <el-table-column type="selection" width="50" align="center"></el-table-column>
                <el-table-column prop="id" label="ID" align="center" width="100">
                    <template slot-scope="scope">
                        <span class="id-cell">{{scope.row.id}}</span>
                    </template>
                </el-table-column>
                <el-table-column prop="content" label="搜索关键字" min-width="320">
                    <template slot-scope="scope">
                        <span class="feedback-keyword" :title="scope.row.content">{{scope.row.content}}</span>
                    </template>
                </el-table-column>
                <el-table-column prop="create_time" label="搜索时间" align="center" width="200">
                    <template slot-scope="scope">
                        <span class="feedback-time">{{scope.row.create_time}}</span>
                    </template>
                </el-table-column>
            </el-table>
        </div>

        <div class="page">
            <el-pagination @size-change="handleSizeChange" :page-sizes="[10, 20, 50, 100,200,500]" :page-size="10"
                layout="total, sizes, prev, pager, next, jumper" background @current-change="changeCurrentPage"
                :current-page="dataList.current_page" :page-count="dataList.last_page" :total="dataList.total">
            </el-pagination>
        </div>
    </div>

    <el-dialog title="热搜词排行 TOP20" :visible.sync="dialogHotVisible" width="700px" append-to-body @open="getHotKeywords">
        <el-table class="feedback-hot-table" :data="hotList" v-loading="hotLoading" max-height="500" stripe>
            <el-table-column label="排名" align="center" width="80">
                <template slot-scope="scope">
                    <span class="hot-rank" :class="'top-' + (scope.$index + 1)">{{scope.$index + 1}}</span>
                </template>
            </el-table-column>
            <el-table-column prop="keyword" label="关键词" min-width="260"></el-table-column>
            <el-table-column prop="count" label="搜索次数" align="center" width="120">
                <template slot-scope="scope">
                    <span class="feedback-count">{{scope.row.count}}</span>
                </template>
            </el-table-column>
            <el-table-column prop="last_time" label="最近搜索时间" align="center" width="180"></el-table-column>
        </el-table>
    </el-dialog>

    {include file="common/footer"/}
    <script>
        var app = new Vue({
            el: '#app',
            mounted() {
                var headerActions = document.querySelector('.header-actions');
                var elHeader = document.querySelector('.el-header');
                if (headerActions && elHeader) {
                    elHeader.appendChild(headerActions);
                }
            },
            data() {
                return {
                    loading: true,
                    dataList: [],
                    selectList: [],
                    stats: {
                        today: 0,
                        week: 0,
                        month: 0,
                        total: 0
                    },
                    panTypes: [],
                    dialogHotVisible: false,
                    hotLoading: false,
                    hotList: [],
                    form: {
                        page: 1,
                        per_page: 10,
                        order: 'id desc',
                        pan_type: '',
                        content: ''
                    },
                }
            },
            created() {
                this.getList();
                this.getStats();
            },
            methods: {
                handleSizeChange(per_page) {
                    this.form.per_page = per_page;
                    this.getList();
                },
                changeCurrentPage(page) {
                    this.form.page = page;
                    this.getList();
                },
                getList_search() {
                    this.form.page = 1;
                    this.getList();
                    this.getStats();
                },
                changeSelection(list) {
                    var that = this;
                    that.selectList = [];
                    for (var index in list) {
                        that.selectList.push(list[index].id);
                    }
                },
                postMultDelete() {
                    var that = this;
                    if (that.selectList.length == 0) {
                        that.$message.error('未选择任何记录！');
                        return;
                    }
                    this.$confirm('即将删除选中的 ' + that.selectList.length + ' 条搜索记录, 是否确认?', '批量删除', {
                        confirmButtonText: '删除',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(() => {
                        axios.post('/admin/feedback/delete', Object.assign({}, PostBase, {
                            id: that.selectList.join(",")
                        }))
                            .then(function (response) {
                                if (response.data.code == CODE_SUCCESS) {
                                    that.$message.success(response.data.message);
                                    that.selectList = [];
                                    that.getList();
                                    that.getStats();
                                } else {
                                    that.$message.error(response.data.message);
                                }
                            })
                            .catch(function (error) {
                                that.$message.error('服务器内部错误');
                                console.log(error);
                            });
                    }).catch(() => {
                    });
                },
                resetSearch() {
                    this.form.content = '';
                    this.form.pan_type = '';
                    this.getList_search();
                },
                getList() {
                    var that = this;
                    that.loading = true;
                    axios.post('/admin/feedback/getList', Object.assign({}, PostBase, that.form))
                        .then(function (response) {
                            that.loading = false;
                            if (response.data.code == CODE_SUCCESS) {
                                that.dataList = response.data.data;
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.loading = false;
                            that.$message.error('服务器内部错误');
                        });
                },
                onPanTypeChange() {
                    this.getList_search();
                },
                getStats() {
                    var that = this;
                    axios.post('/admin/feedback/getStats', Object.assign({pan_type: this.form.pan_type}, PostBase))
                        .then(function (response) {
                            if (response.data.code == CODE_SUCCESS) {
                                that.stats = response.data.data;
                                if (response.data.data.pan_types) {
                                    that.panTypes = response.data.data.pan_types;
                                }
                            }
                        })
                        .catch(function (error) {
                            console.error('获取统计数据失败', error);
                        });
                },
                getHotKeywords() {
                    var that = this;
                    that.hotLoading = true;
                    axios.post('/admin/feedback/getHotKeywords', Object.assign({}, PostBase, { limit: 20 }))
                        .then(function (response) {
                            that.hotLoading = false;
                            if (response.data.code == CODE_SUCCESS) {
                                that.hotList = response.data.data.items || [];
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.hotLoading = false;
                            that.$message.error('获取热搜词失败');
                        });
                },
                confirmClear() {
                    var that = this;
                    this.$confirm('确定要清空所有数据吗？此操作不可恢复！', '警告', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(function () {
                        that.clearAll();
                    }).catch(function () {
                    });
                },
                clearAll() {
                    var that = this;
                    axios.post('/admin/feedback/clearAll', Object.assign({}, PostBase))
                        .then(function (response) {
                            if (response.data.code == CODE_SUCCESS) {
                                that.$message.success('清空成功');
                                that.getList();
                                that.getStats();
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.$message.error('清空失败');
                        });
                },
                confirmBatchAdd() {
                    var that = this;
                    this.$confirm('确定要添加100条测试记录吗？内容为"[夸克] 哪吒之魔童闹海"，提交时间为昨天。', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'info'
                    }).then(function () {
                        that.batchAdd();
                    }).catch(function () {
                    });
                },
                batchAdd() {
                    var that = this;
                    that.loading = true;
                    axios.post('/admin/feedback/batchAdd', Object.assign({}, PostBase, {
                        content: '[夸克] 哪吒之魔童闹海',
                        count: 100,
                        day: 'today'
                    }))
                        .then(function (response) {
                            that.loading = false;
                            if (response.data.code == CODE_SUCCESS) {
                                that.$message.success(response.data.message);
                                that.getList();
                                that.getStats();
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.loading = false;
                            that.$message.error('添加失败');
                        });
                }
            }
        })
    </script>
</html>
