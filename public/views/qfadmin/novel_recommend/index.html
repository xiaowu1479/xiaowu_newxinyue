<!DOCTYPE html>
<html>

<head>
    <title>小说推荐位管理</title>
    <style>
    .novel-recommend-panel {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 32px);
    }
    .novel-recommend-panel .el-form { flex-shrink: 0; margin-bottom: 0 !important; }
    .novel-recommend-panel .el-form .el-form-item { margin-bottom: 0 !important; }
    .novel-recommend-panel .el-table {
        border-radius: 4px;
        overflow: hidden;
        flex: 1;
    }
    .novel-recommend-panel .el-table .el-table__body-wrapper {
        overflow-y: auto;
        max-height: calc(100vh - 160px);
    }
    .novel-recommend-panel .el-table th.el-table__cell {
        background: #f5f7fa !important;
        color: #909399;
        font-weight: 600;
        font-size: 13px;
    }
    .novel-recommend-panel .el-table td.el-table__cell {
        color: #606266;
        font-size: 13px;
    }
    .novel-recommend-cover {
        width: 48px;
        height: 64px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #ebeef5;
    }
    .form-tip {
        font-size: 12px;
        color: #909399;
        line-height: 20px;
        margin-top: 4px;
    }
    </style>
    {include file="common/header"/}
    <div class="novel-recommend-panel">
    <el-form :inline="true" style="text-align: right;">
        <el-form-item style="margin-right: 0;">
            <el-button icon="el-icon-plus" size="small" @click="clickAdd" type="primary" style="border-radius: 8px;">添加推荐</el-button>
        </el-form-item>
    </el-form>
    <el-table :data="dataList" v-loading="loading">
        <el-table-column prop="novel_recommend_id" label="ID" width="60">
        </el-table-column>
        <el-table-column label="封面" width="90">
            <template slot-scope="scope">
                <img :src="scope.row.novel_recommend_cover" class="novel-recommend-cover" v-if="scope.row.novel_recommend_cover" />
            </template>
        </el-table-column>
        <el-table-column prop="novel_recommend_title" label="书名">
        </el-table-column>
        <el-table-column label="跳转链接" min-width="200">
            <template slot-scope="scope">
                <el-link :href="scope.row.novel_recommend_link" target="_blank" type="primary" :underline="false" v-if="scope.row.novel_recommend_link">{{scope.row.novel_recommend_link}}</el-link>
                <span v-else style="color: #c0c4cc;">无(点击用书名搜索)</span>
            </template>
        </el-table-column>
        <el-table-column prop="novel_recommend_sort" label="排序" width="80" align="center">
        </el-table-column>
        <el-table-column label="状态" width="100" align="center">
            <template slot-scope="scope">
                <el-switch v-model="scope.row.novel_recommend_status==1?false:true"
                    @change="clickStatus(scope.row.novel_recommend_id,'novel_recommend_status',scope.row.novel_recommend_status)">
                </el-switch>
            </template>
        </el-table-column>
        <el-table-column label="操作" width="160">
            <template slot-scope="scope">
                <el-link type="primary" @click="clickEdit(scope.row)"
                    :underline="false">编辑</el-link>&nbsp;&nbsp;&nbsp;&nbsp;
                <el-link type="danger" @click="clickDelete(scope.row)" :underline="false">删除</el-link>
            </template>
        </el-table-column>
    </el-table>
    </div>


    <!-- 添加框 -->
    <el-dialog title="添加推荐" :visible.sync="dialogFormAdd" width="560px" :modal-append-to-body='false' append-to-body
        :close-on-click-modal='false'>
        <el-form :model="formAdd" :rules="rules" ref="formAdd" label-width="100px">
            <el-form-item prop="novel_recommend_cover" label="封面">
                <Single v-model="formAdd.novel_recommend_cover"></Single>
                <div class="form-tip">建议 3:4 竖版封面，前台展示约 120×160</div>
            </el-form-item>
            <el-form-item prop="novel_recommend_title" label="书名">
                <el-input size="medium" autocomplete="off" v-model="formAdd.novel_recommend_title" placeholder="点击推荐位时用此书名搜索"></el-input>
            </el-form-item>
            <el-form-item prop="novel_recommend_link" label="跳转链接">
                <el-input size="medium" autocomplete="off" v-model="formAdd.novel_recommend_link" placeholder="为空则点击用书名搜索"></el-input>
                <div class="form-tip">填写完整网址时新窗口打开；留空则点击用书名站内搜索</div>
            </el-form-item>
            <el-form-item prop="novel_recommend_sort" label="排序">
                <el-input-number v-model="formAdd.novel_recommend_sort" :min="0" :max="999" size="medium" style="width: 120px;"
                    controls-position="right" />
                <span class="form-tip" style="margin-left: 8px;">数字越小越靠前</span>
            </el-form-item>
            <el-form-item label="状态">
                <el-switch v-model="formAdd.novel_recommend_status" :active-value="0" :inactive-value="1" active-text="启用"
                    inactive-text="禁用"></el-switch>
            </el-form-item>
        </el-form>
        <div slot="footer" class="dialog-footer">
            <el-button type="primary" @click="postAdd()">确认添加</el-button>
        </div>
    </el-dialog>
    <!-- 修改框 -->
    <el-dialog title="修改推荐" :visible.sync="dialogFormEdit" width="560px" :modal-append-to-body='false'
        append-to-body :close-on-click-modal='false'>
        <el-form :model="formEdit" :rules="rules" ref="formEdit" label-width="100px">
            <el-form-item prop="novel_recommend_cover" label="封面">
                <Single v-model="formEdit.novel_recommend_cover"></Single>
                <div class="form-tip">建议 3:4 竖版封面，前台展示约 120×160</div>
            </el-form-item>
            <el-form-item prop="novel_recommend_title" label="书名">
                <el-input size="medium" autocomplete="off" v-model="formEdit.novel_recommend_title" placeholder="点击推荐位时用此书名搜索"></el-input>
            </el-form-item>
            <el-form-item prop="novel_recommend_link" label="跳转链接">
                <el-input size="medium" autocomplete="off" v-model="formEdit.novel_recommend_link" placeholder="为空则点击用书名搜索"></el-input>
                <div class="form-tip">填写完整网址时新窗口打开；留空则点击用书名站内搜索</div>
            </el-form-item>
            <el-form-item prop="novel_recommend_sort" label="排序">
                <el-input-number v-model="formEdit.novel_recommend_sort" :min="0" :max="999" size="medium" style="width: 120px;"
                    controls-position="right" />
                <span class="form-tip" style="margin-left: 8px;">数字越小越靠前</span>
            </el-form-item>
            <el-form-item label="状态">
                <el-switch v-model="formEdit.novel_recommend_status" :active-value="0" :inactive-value="1" active-text="启用"
                    inactive-text="禁用"></el-switch>
            </el-form-item>
        </el-form>
        <div slot="footer" class="dialog-footer">
            <el-button type="primary" @click="postEdit()">确认修改</el-button>
        </div>
    </el-dialog>

    {include file="common/footer"/}
    <script>
        var app = new Vue({
            el: '#app',
            data() {
                this.getList();
                return {
                    dialogFormAdd: false,
                    dialogFormEdit: false,
                    loading: true,
                    dataList: [],
                    formAdd: {
                        novel_recommend_cover: '',
                        novel_recommend_title: '',
                        novel_recommend_link: '',
                        novel_recommend_sort: 0,
                        novel_recommend_status: 0
                    },
                    formEdit: {},
                    rules: {
                        novel_recommend_title: [{ required: true, message: '请输入书名', trigger: 'blur' }],
                        novel_recommend_cover: [{ required: true, message: '请上传封面', trigger: 'change' }],
                    },
                }
            },
            methods: {
                postEdit() {
                    var that = this;
                    that.$refs["formEdit"].validate((valid) => {
                        if (valid) {
                            axios.post('/admin/novel_recommend/update', Object.assign({}, PostBase, that.formEdit))
                                .then(function (response) {
                                    that.getList();
                                    if (response.data.code == CODE_SUCCESS) {
                                        that.$message({
                                            message: response.data.message,
                                            type: 'success'
                                        });
                                        that.dialogFormEdit = false;
                                    } else {
                                        that.$message.error(response.data.message);
                                    }
                                })
                                .catch(function (error) {
                                    that.$message.error('服务器内部错误');
                                    console.log(error);
                                });
                        }
                    });
                },
                postAdd() {
                    var that = this;
                    that.$refs['formAdd'].validate((valid) => {
                        if (valid) {
                            axios.post('/admin/novel_recommend/add', Object.assign({}, PostBase, that.formAdd))
                                .then(function (response) {
                                    that.getList();
                                    if (response.data.code == CODE_SUCCESS) {
                                        that.$message({
                                            message: response.data.message,
                                            type: 'success'
                                        });
                                        that.dialogFormAdd = false;
                                    } else {
                                        that.$message.error(response.data.message);
                                    }
                                })
                                .catch(function (error) {
                                    that.$message.error('服务器内部错误');
                                    console.log(error);
                                });
                        }
                    });
                },
                clickAdd() {
                    var that = this;
                    that.formAdd = {
                        novel_recommend_cover: '',
                        novel_recommend_title: '',
                        novel_recommend_link: '',
                        novel_recommend_sort: 0,
                        novel_recommend_status: 0
                    };
                    that.dialogFormAdd = true;
                },
                clickDelete(row) {
                    var that = this;
                    this.$confirm('即将删除这个推荐, 是否确认?', '删除提醒', {
                        confirmButtonText: '删除',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(() => {
                        axios.post('/admin/novel_recommend/delete', Object.assign({}, PostBase, {
                            novel_recommend_id: row.novel_recommend_id
                        }))
                            .then(function (response) {
                                that.getList();
                                if (response.data.code == CODE_SUCCESS) {
                                    that.$message({
                                        message: response.data.message,
                                        type: 'success'
                                    });
                                } else {
                                    that.$message.error(response.data.message);
                                }
                            })
                            .catch(function (error) {
                                that.$message.error('服务器内部错误');
                                console.log(error);
                            });
                    }).catch(() => {
                    });
                },
                clickStatus(novel_recommend_id, type, status) {
                    var that = this;
                    axios.post('/admin/novel_recommend/setStatus', Object.assign({}, PostBase, {
                        novel_recommend_id: novel_recommend_id,
                        type: type,
                        status: status
                    }))
                        .then(function (response) {
                            that.getList();
                            if (response.data.code == CODE_SUCCESS) {
                                that.$message({
                                    message: response.data.message,
                                    type: 'success'
                                });
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.$message.error('服务器内部错误');
                            console.log(error);
                        });
                },
                clickEdit(row) {
                    var that = this;
                    axios.post('/admin/novel_recommend/detail', Object.assign({}, PostBase, {
                        novel_recommend_id: row.novel_recommend_id
                    }))
                        .then(function (response) {
                            if (response.data.code == CODE_SUCCESS) {
                                that.formEdit = response.data.data;
                                that.formEdit.novel_recommend_cover = that.formEdit.novel_recommend_cover || '';
                                that.dialogFormEdit = true;
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.$message.error('服务器内部错误');
                            console.log(error);
                        });
                },
                getList() {
                    var that = this;
                    that.loading = true;
                    axios.post('/admin/novel_recommend/getList', Object.assign({}, PostBase))
                        .then(function (response) {
                            that.loading = false;
                            if (response.data.code == CODE_SUCCESS) {
                                that.dataList = response.data.data;
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.loading = false;
                            that.$message.error('服务器内部错误');
                            console.log(error);
                        });
                },
            }
        })
    </script>


</html>
